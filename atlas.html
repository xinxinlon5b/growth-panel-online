<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>全景知识树 · 企业 AI 落地</title>
<style>
/* ==========================================================
   苹果 Vision Pro 极简高级版 · 2026-09-10 重做
   核心: 极轻字重 + 巨幅留白 + 几无装饰 + 颜色讲故事
   ========================================================== */
:root{
  --bg:#000;
  --bg2:#0a0a0a;
  --glass:rgba(22,22,23,.72);
  --line:rgba(255,255,255,.08);
  --line2:rgba(255,255,255,.14);
  --txt:#f5f5f7;
  --txt2:#d2d2d7;
  --dim:#86868b;
  --dim2:#6e6e73;
  --dim3:#48484a;
  --blue:#2997ff;
  --blue2:#4cc2ff;
  --blueSoft:rgba(41,151,255,.12);
  --orange:#ff9f0a;
  --green:#30d158;
  --purple:#bf5af2;
  --teal:#40c8e0;
  --pink:#ff375f;
  --ease:cubic-bezier(.32,.72,0,1);
  --radius-lg:22px;
  --radius-md:14px;
  --radius-sm:9px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{
  color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;
  -webkit-font-smoothing:antialiased;
  font-feature-settings:"kern" 1, "ss01" 1;
  letter-spacing:-.005em;
}

/* ============ 顶栏：极薄毛玻璃 ============ */
#bar{
  position:fixed;top:0;left:0;right:0;height:48px;z-index:30;
  display:flex;align-items:center;gap:10px;padding:0 22px;
  background:rgba(0,0,0,.6);
  -webkit-backdrop-filter:saturate(180%) blur(28px);
  backdrop-filter:saturate(180%) blur(28px);
  border-bottom:.5px solid var(--line);
  font-size:14px;font-weight:500;letter-spacing:-.01em;
}
#bar .logo{font-size:14px;font-weight:600;color:var(--txt);white-space:nowrap;margin-right:6px}
#bar .logo i{color:var(--dim);font-weight:400;font-style:normal;margin-left:6px}
#q{
  width:240px;height:30px;background:rgba(255,255,255,.06);border:.5px solid var(--line);
  border-radius:var(--radius-sm);color:var(--txt);padding:0 12px;font-size:13px;
  outline:none;font-family:inherit;transition:.2s var(--ease)
}
#q::placeholder{color:var(--dim3)}
#q:focus{background:rgba(255,255,255,.1);border-color:var(--blue)}
.btn{
  height:30px;padding:0 14px;border-radius:var(--radius-sm);background:transparent;
  border:none;color:var(--blue);font-size:13px;font-weight:400;font-family:inherit;
  cursor:pointer;white-space:nowrap;transition:.2s var(--ease);letter-spacing:-.01em
}
.btn:hover{color:var(--blue2)}
.btn.act{color:var(--txt)}
.btn::after{content:"\00a0→";opacity:.4;transition:opacity .2s var(--ease)}
.btn:hover::after{opacity:1}
#hint{margin-left:auto;color:var(--dim3);font-size:12px;font-weight:400;letter-spacing:0}

/* ============ Hero 巨幅区 ============ */
#hero{
  position:fixed;top:48px;left:0;right:0;bottom:0;z-index:0;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  pointer-events:none;text-align:center;padding-top:11vh;overflow:hidden
}
#hero h1{
  font-size:clamp(56px, 8vw, 120px);font-weight:600;letter-spacing:-.04em;
  background:linear-gradient(180deg,#f5f5f7 0%,#a1a1a6 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  margin:0;line-height:1.02;opacity:.95
}
#hero h2{
  font-size:clamp(18px,1.5vw,22px);font-weight:400;color:var(--dim);
  letter-spacing:0;margin-top:14px;line-height:1.4
}
#hero .crumbs{
  display:flex;gap:14px;margin-top:32px;font-size:12px;font-weight:500;letter-spacing:.04em;
  color:var(--dim3);text-transform:uppercase
}
#hero .crumbs span{padding:6px 14px;border-radius:999px;border:.5px solid var(--line);background:rgba(255,255,255,.03)}

/* ============ 画布：树状脑图 ============ */
#main{position:fixed;inset:48px 0 0;display:flex;z-index:5}
#canvas{flex:1;position:relative;overflow:hidden;cursor:grab}
#canvas.drag{cursor:grabbing}
svg{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

.link{fill:none;stroke:rgba(255,255,255,.1);stroke-width:.8}
.link.hi{stroke:rgba(41,151,255,.7);stroke-width:1.5;filter:drop-shadow(0 0 6px rgba(41,151,255,.5))}

.node{cursor:pointer}
.node .box{
  fill:rgba(28,28,30,.7);stroke:rgba(255,255,255,.08);stroke-width:.5;
  rx:14;ry:14;
  filter:drop-shadow(0 6px 20px rgba(0,0,0,.45));
  transition:fill .25s var(--ease),stroke .25s var(--ease),filter .25s var(--ease)
}
.node:hover .box{fill:rgba(38,38,40,.85);stroke:rgba(255,255,255,.16)}
.node.sel .box{fill:rgba(41,151,255,.14);stroke:var(--blue);stroke-width:1}
.node.dim{opacity:.16}
.node.hit .box{stroke:var(--orange);stroke-width:1}
.node .lab{fill:var(--txt);font-size:13px;font-weight:500;font-family:inherit;pointer-events:none;user-select:none;letter-spacing:-.005em}
.node .sub{fill:var(--dim);font-size:10.5px;font-weight:400;pointer-events:none;user-select:none;font-family:inherit;letter-spacing:0}
.node .acc{pointer-events:none}
.node .tgl{fill:rgba(255,255,255,.05);rx:4;cursor:pointer;transition:fill .2s var(--ease)}
.node .tgl:hover{fill:rgba(255,255,255,.18)}
.node .tsig{fill:var(--dim);font-size:11px;font-weight:500;pointer-events:none;user-select:none;text-anchor:middle}

.n-root .box{fill:rgba(0,0,0,.9);stroke:rgba(41,151,255,.4);stroke-width:1}
.n-root .lab{fill:#fff;font-size:16px;font-weight:600;letter-spacing:-.015em}
.n-root .sub{fill:var(--dim2);font-size:11px;font-weight:400}

/* ============ 侧栏：浮起玻璃 ============ */
#side{
  position:fixed;right:0;top:48px;bottom:0;width:380px;z-index:25;
  background:rgba(22,22,23,.78);
  -webkit-backdrop-filter:saturate(180%) blur(40px);
  backdrop-filter:saturate(180%) blur(40px);
  border-left:.5px solid var(--line);
  transform:translateX(100%);transition:transform .4s var(--ease);
  display:flex;flex-direction:column
}
#side.on{transform:translateX(0)}
#side .hd{padding:32px 28px 20px;flex:0 0 auto}
#side .badge{
  display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.08em;
  padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.05);
  color:var(--dim);margin-bottom:14px;text-transform:uppercase
}
#side h2{
  font-size:28px;font-weight:600;letter-spacing:-.025em;line-height:1.15;
  color:var(--txt);word-break:break-word
}
#side .bd{padding:0 28px 36px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
#side .bd p{color:var(--dim);font-size:13.5px;font-weight:400;line-height:1.7;margin-bottom:18px;letter-spacing:0}
#side .kv{font-size:11.5px;color:var(--dim3);margin-bottom:8px;word-break:break-all;line-height:1.5;font-weight:400}
#side .acts{display:flex;flex-direction:column;gap:10px;margin-top:8px}
#side .act{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  height:40px;padding:0 18px;border-radius:var(--radius-md);
  background:var(--blue);color:#fff;font-size:14px;font-weight:500;font-family:inherit;
  border:none;cursor:pointer;transition:.2s var(--ease);
  text-decoration:none;width:fit-content
}
#side .act::after{content:"\00a0→";opacity:.6}
#side .act:hover{background:#0077e6}
#side .act:active{transform:scale(.97)}
#side .act.ghost{background:transparent;border:.5px solid var(--line2);color:var(--blue)}
#side .children{margin-top:32px;border-top:.5px solid var(--line);padding-top:24px}
#side .children .t{
  font-size:11px;color:var(--dim3);font-weight:600;letter-spacing:.08em;
  margin-bottom:14px;text-transform:uppercase
}
#side .chip{
  display:inline-flex;align-items:center;font-size:13px;font-weight:400;
  padding:7px 13px;margin:0 6px 8px 0;border-radius:999px;
  background:rgba(255,255,255,.05);border:.5px solid transparent;cursor:pointer;
  color:var(--txt2);font-family:inherit;transition:.2s var(--ease)
}
#side .chip:hover{background:rgba(255,255,255,.1);color:var(--txt);border-color:var(--line2)}

#sideMask{position:fixed;inset:48px 0 0;background:rgba(0,0,0,.5);z-index:24;display:none;cursor:pointer}
#sideMask.on{display:block}

/* ============ 弹层：iOS sheet 全屏 ============ */
#modal{
  position:fixed;inset:0;z-index:60;display:none;padding:0;
  background:rgba(0,0,0,.7);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  backdrop-filter:blur(24px) saturate(180%);
  animation:fadeIn .3s var(--ease)
}
#modal.on{display:flex;align-items:flex-start;justify-content:center}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes sheetUp{from{opacity:0;transform:translateY(20px) scale(.99)}to{opacity:1;transform:none}}
#mwrap{
  background:#0a0a0a;border:.5px solid var(--line);border-radius:0;
  width:100%;height:100%;max-height:100vh;display:flex;flex-direction:column;overflow:hidden;
  animation:sheetUp .35s var(--ease)
}
#mhd{
  height:52px;padding:0 14px;
  display:flex;align-items:center;gap:12px;flex:0 0 auto;
  background:rgba(10,10,10,.85);
  -webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);
  border-bottom:.5px solid var(--line);
  position:sticky;top:0;z-index:3
}
#mback{
  display:inline-flex;align-items:center;gap:4px;
  height:34px;padding:0 13px 0 10px;border-radius:8px;border:none;
  background:rgba(255,255,255,.07);color:var(--blue);
  font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;
  transition:.18s var(--ease);white-space:nowrap;letter-spacing:-.005em
}
#mback::before{content:"‹";font-size:15px;line-height:1;opacity:.7}
#mback:hover{background:rgba(255,255,255,.12)}
#mback:active{transform:scale(.96)}
#mhd .t{flex:1;font-size:13.5px;font-weight:500;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#mbd{padding:36px 48px 80px;overflow-y:auto;font-size:15px;line-height:1.75;color:var(--txt2);flex:1;-webkit-overflow-scrolling:touch;font-weight:400}
#mbd h1{font-size:34px;font-weight:600;letter-spacing:-.025em;margin:0 0 18px;padding-bottom:14px;border-bottom:.5px solid var(--line);color:var(--txt)}
#mbd h2{font-size:22px;font-weight:600;letter-spacing:-.015em;margin:36px 0 12px;color:var(--txt)}
#mbd h3{font-size:17px;font-weight:600;margin:24px 0 8px;color:var(--txt)}
#mbd h4{font-size:15px;font-weight:600;margin:18px 0 6px;color:var(--txt2)}
#mbd p{margin-bottom:14px}
#mbd ul,#mbd ol{margin:0 0 16px 24px}
#mbd li{margin-bottom:6px}
#mbd table{width:100%;border-collapse:collapse;font-size:13px;margin:18px 0;border:.5px solid var(--line);border-radius:var(--radius-md);overflow:hidden}
#mbd th{background:rgba(255,255,255,.04);text-align:left;padding:11px 14px;color:var(--dim);font-size:11.5px;font-weight:600;border-bottom:.5px solid var(--line);letter-spacing:.04em;text-transform:uppercase}
#mbd td{padding:11px 14px;border-bottom:.5px solid rgba(255,255,255,.04);vertical-align:top;color:var(--txt2)}
#mbd code{background:rgba(255,255,255,.06);padding:2px 7px;border-radius:5px;font-size:12.5px;color:var(--orange);font-family:"SF Mono",Menlo,monospace}
#mbd pre{background:#141416;border:.5px solid var(--line);border-radius:var(--radius-md);padding:16px;overflow-x:auto;margin:16px 0;font-size:12.5px;line-height:1.65}
#mbd blockquote{border-left:2px solid var(--blue);padding:4px 0 4px 16px;color:var(--dim);margin:16px 0}
#mbd hr{border:none;border-top:.5px solid var(--line);margin:28px 0}
#mbd a{color:var(--blue);text-decoration:none}
#mbd a:hover{text-decoration:underline}

/* ============ 底部胶囊图例 ============ */
#leg{
  position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:15;
  display:flex;gap:6px;padding:6px;
  background:rgba(22,22,23,.7);
  -webkit-backdrop-filter:saturate(180%) blur(28px);
  backdrop-filter:saturate(180%) blur(28px);
  border:.5px solid var(--line);border-radius:999px;
  font-size:11px;font-weight:500;letter-spacing:.02em;color:var(--dim)
}
#leg .l{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;cursor:default}
#leg i{display:inline-block;width:6px;height:6px;border-radius:50%}

/* ============ 缩放控件 ============ */
#zoomctl{position:fixed;right:18px;bottom:18px;display:flex;gap:8px;z-index:15}
#zoomctl .btn{
  width:34px;height:34px;padding:0;font-size:15px;border-radius:50%;
  background:rgba(22,22,23,.7);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  border:.5px solid var(--line);color:var(--dim);font-weight:400
}
#zoomctl .btn::after{content:""}
#zoomctl .btn:hover{background:rgba(38,38,40,.85);color:var(--txt)}

/* ============ 手机布局 ============ */
@media(max-width:900px){
  #bar{height:46px;padding:0 14px;gap:6px}
  #bar .logo{font-size:13px}
  #bar .logo i{display:none}
  #q{order:10;width:100%;height:36px;font-size:14px;margin:6px 0 0;flex:1 1 100%}
  #bar{flex-wrap:wrap;height:auto;padding:8px 14px}
  #hint{display:none}
  .btn{height:32px;padding:0 10px;font-size:12px}
  #hero{padding-top:8vh}
  #hero h1{font-size:46px}
  #hero h2{font-size:15px;padding:0 20px}
  #hero .crumbs{margin-top:20px;flex-wrap:wrap;justify-content:center;padding:0 14px}
  #leg{display:none}
  #zoomctl{right:10px;bottom:10px}
  #side{top:auto;bottom:0;width:100%;height:auto;max-height:80vh;border-left:none;border-top:.5px solid var(--line);border-radius:18px 18px 0 0;transform:translateY(105%);transition:transform .4s var(--ease)}
  #side.on{transform:translateY(0)}
  #side .hd::before{content:"";display:block;width:38px;height:4px;border-radius:2px;background:rgba(255,255,255,.18);margin:0 auto 18px}
  #side .hd{padding:14px 22px 18px}
  #side h2{font-size:22px}
  #side .bd{padding:0 22px 40px}
  #mwrap{border-radius:0}
  #mhd{padding:0 12px}
  #mback{height:38px;padding:0 14px 0 11px;font-size:14px}
  #mhd .t{font-size:12.5px}
  #mbd{padding:24px 20px 80px;font-size:14.5px;line-height:1.8}
  #mbd h1{font-size:26px}
  #mbd h2{font-size:19px}
  #mbd table{font-size:12.5px}
}
</style>
</head>
<body>

<!-- 极简顶栏 -->
<div id="bar">
  <div class="logo">🧭 全景知识树 <i>企业 AI 落地</i></div>
  <input id="q" placeholder="搜索…" autocomplete="off">
  <button class="btn" id="bExpand">展开全部</button>
  <button class="btn" id="bCollapse">收起全部</button>
  <button class="btn" id="bFit">适应屏幕</button>
  <button class="btn" id="bD3">三层视角</button>
  <div id="hint">滚轮缩放 · 拖拽平移 · 点节点看内容</div>
</div>

<!-- 苹果 Hero 区：极轻字 + 巨幅留白 -->
<div id="hero">
  <h1>企业 AI 落地</h1>
  <h2>全景知识树 · 271 个节点 · 16 个 ADR · 5 张地图</h2>
  <div class="crumbs">
    <span>7 阶段</span><span>25 张方法卡</span><span>7 张决策卡</span><span>16 个 ADR</span>
  </div>
</div>

<!-- 画布 -->
<div id="main">
  <div id="canvas">
    <svg id="svg"><g id="world"><g id="links"></g><g id="nodes"></g></g></svg>
  </div>
</div>

<!-- 底部胶囊图例 -->
<div id="leg">
  <div class="l"><i style="background:var(--blue)"></i>板块</div>
  <div class="l"><i style="background:var(--teal)"></i>方法</div>
  <div class="l"><i style="background:var(--orange)"></i>补缺</div>
  <div class="l"><i style="background:var(--purple)"></i>方法卡</div>
  <div class="l"><i style="background:var(--green)"></i>决策卡</div>
  <div class="l"><i style="background:var(--pink)"></i>调度</div>
  <div class="l"><i style="background:var(--dim)"></i>素材</div>
</div>

<!-- 缩放 -->
<div id="zoomctl">
  <button class="btn" id="bIn">＋</button>
  <button class="btn" id="bOut">－</button>
</div>

<!-- 侧栏 -->
<div id="sideMask"></div>
<div id="side">
  <div class="hd"><div class="badge" id="sBadge">节点</div><h2 id="sTitle">—</h2></div>
  <div class="bd">
    <div id="sDesc"></div>
    <div class="kv" id="sFile"></div>
    <div class="acts" id="sActs"></div>
    <div class="children" id="sKids"></div>
  </div>
</div>

<!-- 弹层 -->
<div id="modal"><div id="mwrap">
  <div id="mhd"><button id="mback">返回</button><div class="t" id="mtitle">原文</div></div>
  <div id="mbd"></div>

eam can own」· TOGAF H 变更管理 · ISO 模型退役", "file": "成长系统/34_企业AI落地全景地图_工作台.md"}, {"id": "阶段 7-gun", "label": "库内武器（4 件）", "type": "leaf", "desc": "38 SOP-8 经验资产化 · RETIRE-001 退役合规清单 · 复盘区 28+ 篇 · 41 方法论三件套"}]}]}, {"id": "B", "label": "B 方法论四件套（本轮提炼）", "type": "branch", "desc": "把 1000+ 素材变成能指导工作的东西：38 流程 SOP / 39 实战招式 / 40 补缺 / 41 MECE 汇总", "children": [{"id": "38", "label": "38 FDE 全流程可指导方法论（8 条 SOP）", "type": "doc", "desc": "从 0 到 1 做 AI 项目的全流程：每条含 问题→步骤→产出物→坑→适配→出处", "file": "成长系统/38_FDE全流程可指导方法论_v1.md", "children": [{"id": "38-sop1", "label": "PSF 三关：在立项阶段把「值得做」挑出来", "type": "sop", "desc": "1. 第一关 · 痛点检验：必须同时满足「具体的人 + 具体的事」。把客户那句「我想要 AI 客服」翻译成「客服主管每周一早上要花 3 小时、从 4 个系统手动汇总上周的升级工单」——只有翻译到这一层，才算过这一关。", "file": "成长系统/38_FDE全流程可指导方法论_v1.md", "anchor": "SOP 1 · PSF 三关：在立项阶段把「值得做」挑出来"}, {"id": "38-sop2", "label": "MVD（最小可行部署）：用周级节奏在客户真环境证明价值", "type": "sop", "desc": "1. 第一条军规 · 真实数据没有例外：客户必须带自己的真实业务数据来。Palantir 训练营把这条写进规则，OpenAI 内部按这条线划岗位——FDE 必须在客户基础设施上、用客户真实数据写生产代码。", "file": "成长系统/38_FDE全流程可指导方法论_v1.md", "anchor": "SOP 2 · MVD（最小可行部署）：用周级节奏在客户真环境证明价值"}, {"id": "38-sop3", "label": "五份地图：进场前把客户家底摸透", "type": "sop", "desc": "1. 数据地图：有哪些数据源、谁拥有、质量如何、权限归谁。重点不是「有什么」，是「哪个被信任」——几乎每个组织里，官方数据源和员工真正信任的数据源都不是同一个。", "file": "成长系统/38_FDE全流程可指导方法论_v1.md", "anchor": "SOP 3 · 五份地图：进场前把客户家底摸透"}, {"id": "38-sop4", "label": "评测体系：把「好」翻译成可量化的标尺（AI 产品命门）", "type": "sop", "desc": "1. 第一步 · 评估方案 + 黄金集：明确 3 件事——测什么（答对率/响应速度/幻觉率）、用什么标准（谁来判断对错）、测多少（一般 50-100 条起步）。黄金集要来自客户真实业务素材，不能工程师编。", "file": "成长系统/38_FDE全流程可指导方法论_v1.md", "anchor": "SOP 4 · 评测体系：把「好」翻译成可量化的标尺（AI 产品命门）"}, {"id": "38-sop5", "label": "热修复文化：把上线后的迭代做成以小时计", "type": "sop", "desc": "1. 反馈必须直达写代码的人：用户提了问题，下午字段就加上；车间主任说按钮点不准，明天按钮放大一倍。这种速度对用户的意义远超功能本身。", "file": "成长系统/38_FDE全流程可指导方法论_v1.md", "anchor": "SOP 5 · 热修复文化：把上线后的迭代做成以小时计"}, {"id": "38-sop6", "label": "变革管理三件套：动员客户的整个组织为你站台", "type": "sop", "desc": "1. 支持者经营：每个成功部署背后都站着一个客户内部的支持者。给他能讲的材料（讲得出去的故事）、给他战功（把远见变成他职业亮点）、给他安全感（失败时你顶在前面）。教程原话「一个被善待的支持者，胜过十场产品宣讲会」（源自 fde_04 4.6", "file": "成长系统/38_FDE全流程可指导方法论_v1.md", "anchor": "SOP 6 · 变革管理三件套：动员客户的整个组织为你站台"}, {"id": "38-sop7", "label": "灯塔筛选：把 80% 产能压在 20% 真正重要的客户上", "type": "sop", "desc": "1. 决策矩阵只有两个维度：灯塔价值（行业信号强度）+ 学习价值（能沉淀多少可复用能力）。两个都高的客户甚至应该倒贴资源优先做。教程原话「Palantir 早期免费做试点、烧掉数百万美元，赌的就是这个矩阵」。", "file": "成长系统/38_FDE全流程可指导方法论_v1.md", "anchor": "SOP 7 · 灯塔筛选：把 80% 产能压在 20% 真正重要的客户上"}, {"id": "38-sop8", "label": "经验资产化：从 1 到 N 的飞轮", "type": "sop", "desc": "1. 部署模板化：把环境搭建、权限配置、监控接入，打包成一键式 IaC（基础设施即代码）。新客户进场第一天就能拉起标准化环境，而不是从零配置一周。教程原话「Decagon 能把简单场景的部署压到 15 天，背后是高度模板化的接入层」。", "file": "成长系统/38_FDE全流程可指导方法论_v1.md", "anchor": "SOP 8 · 经验资产化：从 1 到 N 的飞轮"}]}, {"id": "39", "label": "39 视频实战经验方法论（9 类 58 法）", "type": "doc", "desc": "111 方法簇提炼：★接单弹药 / ⚪工具玩法 / 🟡可迁移", "file": "成长系统/39_514视频实战经验方法论文集_v1.md", "children": [{"id": "39-一、企业", "label": "一、企业 AI 落地·接单武器 🎯（9 簇 → 6 法）★", "type": "cat39", "desc": "6 条方法", "children": [{"id": "39-1.1", "label": "1.1 业务前置验证三件套——AI 落地前先做尽调", "type": "method", "file": "成长系统/39_514视频实战经验方法论文集_v1.md", "anchor": "方法 1.1", "desc": "解决什么问题：企业花 30 万上 AI、3 个月后只剩行政写周报——钱花了、效果没出。根因不是工具差，是没做业务前提验证。"}, {"id": "39-1.2", "label": "1.2 FDE 驻场轻量交付五步法", "type": "method", "file": "成长系统/39_514视频实战经验方法论文集_v1.md", "anchor": "方法 1.2", "desc": "解决什么问题：FDE（Forward Deployed Engineer，前线部署工程师）入企业后怎么快速出活、让客户看到价值、避免被当外包使。"}, {"id": "39-1.3", "label": "1.3 价值导向报价与流程重构定位", "type": "method", "file": "成长系统/39_514视频实战经验方法论文集_v1.md", "anchor": "方法 1.3", "desc": "解决什么问题：AI 项目到底怎么定价？报低了不赚钱，报高了客户跑路。根因是用成本加成定价，没体现价值。"}, {"id": "39-1.4", "label": "1.4 场景化 AI 自动化系统搭建", "type": "method", "file": "成长系统/39_514视频实战经验方法论文集_v1.md", "anchor": "方法 1.4", "desc": "解决什么问题：客户要\"上 AI\"，但具体到场景（电商上新、客服应答、财务对账）该怎么选工具、怎么搭？"}, {"id": "39-1.5", "label": "1.5 组织能力沉淀三阶火箭", "type": "method", "file": "成长系统/39_514视频实战经验方法论文集_v1.md", "anchor": "方法 1.5", "desc": "解决什么问题：客户上了 AI 工具，半年后又吃灰——不是工具不行，是组织没沉淀出能持续放大 AI 的能力。"}, {"id": "39-1.6", "label": "1.6 AI 改造前的\"反 AI 幻觉\"提问清单", "type": "method", "file": "成长系统/39_514视频实战经验方法论文集_v1.md", "anchor": "方法 1.6", "desc": "解决什么问题：客户说\"我想要个 AI 帮我做 XXX\"，但其实是想要个 XX——签单后才发现需求对不上，必烂尾。"}]}, {"id": "39-二、智能", "label": "二、智能体·OpenClaw·Hermes 🤖（23 簇 → 7 法）⚪+🟡", "type": "cat39", "desc": "7 条方法", "children": [{"id": "39-2.1", "label": "2.1 零门槛本地部署三件套——小白别被命令行吓跑", "type": "method", "file": "成长系统/39_514视频实战经验方法论文集_v1.md", "anchor": "方法 2.1", "desc": "解决什么问题：普通人看到\"本地部署大模型\"就头大，怕命令行、怕 Token 费、怕报错。真方法是用图形化工具 + 免费模型 + 网页服务，把门槛降到点鼠标。"}, {"id": "39-2.2", "label": "2.2 给 Agent 装上操作电脑的\"三种手脚\"", "type": "method", "file": "成长系统/39_514视频实战经验方法论文集_v1.md", "anchor": "方法 2.2", "desc": "解决什么问题：AI 只能聊天不能干活——不会点按钮、不会敲命令、不会操作软件。根因是 Agent 缺乏\"操作能力\"。"}, {"id": "39-2.3", "label": "2.3 多 Agent 协同的四种架构", "type": "method", "file": "成长系统/39_514视频实战经验方法论文集_v1.md", "anchor": "方法 2.3", "desc": "解决什么问题：单 Agent 干活返工率高、效率低、容易跑偏。真方法是多个各司其职的 Agent 协同——但架构选错会一团乱。"}, {"id": "39-2.4", "label": "2.4 把日常对话沉淀成可复用 Skills 与长期记忆", "type": "method", "file": "成长系统/39_514视频实战经验方法论文集_v1.md", "anchor": "方法 2.4", "desc": "解决什么问题：AI 用完即忘、每次从零开始——你教它十遍它还是小学生。真方法是把聊天自动结构化沉淀为长期记忆和可调用技能。"}, {"id": "39-2.5", "label": "2.5 底层逻辑先吃透再搭工作流", "type": "method", "file": "成长系统/39_514视频实战经验方法论文集_v1.md", "anchor": "方法 2.5", "desc": "解决什么问题：新手学 Agent 平台只会抄作业、不会自己搭——换个场景就抓瞎。真方法：先啃透变量、类型、JSON 这些地基，再上手工作流。"}, {"id": "39-2.6", "label": "2.6 成本控制三板斧——免费模型 + 本地中间件 + API 套壳", "type": "method", "file": "成长系统/39_514视频实战经验方法论文集_v1.md", "anchor": "方法 2.6", "desc": "解决什么问题：大模型 API 调用贵、国产模型接入难。真方法：用本地中间件安全转发或找免费 API，实现低价甚至零成本接入。"}, {"id": "39-2.7", "label": "2.7 场景扩展三招——让 Agent 随身走、随时用", "type": "method", "file": "成长系统/39_514视频实战经验方法论文集_v1.md", "anchor": "方法 2.7", "desc": "解决什么问题：Agent 只能在固定电脑上用——出差、车上、手机上就抓瞎。真方法：通过硬件改造、移动端、便携部署扩展使用场景。"}]}, {"id": "39-三、AI", "label": "三、AI 编程工具链 💻（34 簇 → 12 法）⚪", "type": "cat39", "desc": "12 条方法", "children": [{"id": "39-3.1", "label": "3.1 基础配置三件套——先别动手，先配好", "type": "method", "file": "成长系统/39_514视频实战经验方法论文集_v1.md", "anchor": "方法 3.1", "desc": "解决什么问题：Codex/Claude Code 安装后直接干活导致效果差——权限没配、模型没选、网络没通。真方法：先花 10 分钟完成基础配置。"}, {"id": "39-3.2", "label": "3.2 需求先行——AI 不是许愿机", "type": "method", "file": "成长系统/39_514视频实战经验方法论文集_v1.md", "anchor": "方法 3.2", "desc": "解决什么问题：AI 生成结果差或效率低——根因是用户没想清楚就丢给 AI。真方法：前期梳理需求逻辑和素材，再让 AI 执行。"}, {"id": "39-3.3", "label": "3.3 用对方案——避免慢和贵", "type": "method", "file": "成长系统/39_514视频实战经验方法论文集_v1.md", "anchor": "方法 3.3", "desc": "解决什么问题：Codex 执行任务慢、消耗 Token 多——根因是技术路径选错（如用 computer use 模拟人工做本可以插件做的事）。"}, {"id": "39-3.4", "label": "3.4 Skill 与 MCP 扩展——让 AI 干\"专业活\"", "type": "method", "file": "成长系统/39_514视频实战经验方法论文集_v1.md", "anchor": "方法 3.4", "desc": "解决什么问题：AI 编程工具默认能力不足（如不会看图、不会生视频、不会读数据）——需要按场景扩展。"}, {"id": "39-3.5", "label": "3.5 Vibe Coding 视觉质感提升——喂好设计而非自己会设计", "type": "method", "file": "成长系统/39_514视频实战经验方法论文集_v1.md", "anchor": "方法 3.5", "desc": "解决什么问题：非设计背景用户用 Vibe Coding 做出\"AI 味\"页面——按钮错位、配色辣眼、字体杂乱。真方法：给 AI 喂高质量设计参考。"}, {"id": "39-3.6", "label": "3.6 零基础落地——不会编程也能做工具", "type": "method", "file": "成长系统/39_514视频实战经验方法论文集_v1.md", "anchor": "方法 3.6", "desc": "解决什么问题：普通人有想法但不会编程，做不出工具。真方法：用 AI 编程工具 + 保姆级教程，零基础也能做 App 或自动化流程。"}, {"id": "39-3.7", "label": "3.7 视频与动画——Codex 的隐藏能力", "type": "method", "file": "成长系统/39_514视频实战经验方法论文集_v1.md", "anchor": "方法 3.7", "desc": "解决什么问题：非专业人士制作视频/动画门槛高——不会 AE、不会剪辑、不会调色。真方法：用 Codex 搭配特定工具，自然语言描述即可生成专业效果。"}, {"id": "39-3.8", "label": "3.8 自动化运营——Codex 跑通全流程", "type": "method", "file": "成长系统/39_514视频实战经验方法论文集_v1.md", "anchor": "方法 3.8", "desc": "解决什么问题：自媒体运营中重复性工作耗时——选选题、找素材、写文案、做封面、发布、互动，每一步都耗时间。真方法：让 Codex 接管全流程。"}, {"id": "39-3.9", "label": "3.9 移动与远程协作——不再绑死在电脑前", "type": "method", "file": "成长系统/39_514视频实战经验方法论文集_v1.md", "anchor": "方法 3.9", "desc": "解决什么问题：开发者不在电脑前时仍需修改代码、查看进度。真方法：手机连接远程服务器召唤 AI 随时干活。"}, {"id": "39-3.10", "label": "3.10 低成本试错——别上来就烧 Token", "type": "method", "file": "成长系统/39_514视频实战经验方法论文集_v1.md", "anchor": "方法 3.10", "desc": "解决什么问题：用 AI 做产品时盲目开发、烧钱无回报。真方法：先验证需求再做产品，用订阅制工具控制成本。"}, {"id": "39-3.11", "label": "3.11 长时任务与工具边界——AI 不是万能的", "type": "method", "file": "成长系统/39_514视频实战经验方法论文集_v1.md", "anchor": "方法 3.11", "desc": "解决什么问题：让 AI 在无人监督下自主完成长时间、多步骤任务；同时避免对 AI 期望过高。"}, {"id": "39-3.12", "label": "3.12 视觉与风格迁移——把静态素材变活", "type": "method", "file": "成长系统/39_514视频实战经验方法论文集_v1.md", "anchor": "方法 3.12", "desc": "解决什么问题：手里有静态图片、Logo、传统素材，但想做出动效/3D/风格化作品——成本高、门槛高。真方法：用 AI 工具直接改造静态素材。"}]}, {"id": "39-四、商业", "label": "四、商业案例·变现样板 💰（9 簇 → 4 法）★", "type": "cat39", "desc": "4 条方法", "children": [{"id": "39-4.1", "label": "4.1 短视频高变现公式——痛点-恐吓-展示-人设", "type": "method", "file": "成长系统/39_514视频实战经验方法论文集_v1.md", "anchor": "方法 4.1", "desc": "解决什么问题：短视频播放量高但变现弱——看完点赞就走、从不付费。真方法：用精准痛点开场 + 专业归因 + 后果恐吓 + 效果展示 + 靠谱人设，驱动用户咨询付费。"}, {"id": "39-4.2", "label": "4.2 AI 规模化变现三模式——数字人/反直觉 App/多平台分发", "type": "method", "file": "成长系统/39_514视频实战经验方法论文集_v1.md", "anchor": "方法 4.2", "desc": "解决什么问题：传统变现模式成本高、难规模化。真方法：用 AI 实现 24 小时不间断的内容生产与销售。"}, {"id": "39-4.3", "label": "4.3 算法冷启动红利——新号也能起量", "type": "method", "file": "成长系统/39_514视频实战经验方法论文集_v1.md", "anchor": "方法 4.3", "desc": "解决什么问题：新号没流量、老号被限流——抖音算法变化下内容不获客。真方法：聚焦垂直专业度，适配行为预测机制，抢占新号冷启动流量。"}, {"id": "39-4.4", "label": "4.4 品牌底层逻辑——AI 不是孤立工具", "type": "method", "file": "成长系统/39_514视频实战经验方法论文集_v1.md", "anchor": "方法 4.4", "desc": "解决什么问题：AI 在真实商业中落地脱节——技术牛但客户不买账。真方法：从品牌与消费者关系出发，将 AI 嵌入商业底层逻辑。"}]}, {"id": "39-五、AI", "label": "五、AI 内容创作 🎨（9 簇 → 7 法）⚪", "type": "cat39", "desc": "7 条方法", "children": [{"id": "39-5.1", "label": "5.1 导演思维优先——故事内核比工具重要", "type": "method", "file": "成长系统/39_514视频实战经验方法论文集_v1.md", "anchor": "方法 5.1", "desc": "解决什么问题：AI 视频创作中重技术轻叙事——画面炫酷但没人看得懂。真方法：先想清楚要表达什么故事和情绪，再选择 AI 工具执行。"}, {"id": "39-5.2", "label": "5.2 少素材高质感——8 张照片做出宣传片", "type": "method", "file": "成长系统/39_514视频实战经验方法论文集_v1.md", "anchor": "方法 5.2", "desc": "解决什么问题：实拍素材不足或成本高——没钱请团队、没时间拍大片。真方法：用少量实拍照片结合 AI 生成关键帧，实现丝滑运镜和风格化宣传片。"}, {"id": "39-5.3", "label": "5.3 分镜板两步法——风格化动画可控生成", "type": "method", "file": "成长系统/39_514视频实战经验方法论文集_v1.md", "anchor": "方法 5.3", "desc": "解决什么问题：AI 生成动画时动作不连贯、风格难统一。真方法：先生成动作分镜板，再生成动画的两步法。"}, {"id": "39-5.4", "label": "5.4 4K 修复与分步精修——消除 AI 味", "type": "method", "file": "成长系统/39_514视频实战经验方法论文集_v1.md", "anchor": "方法 5.4", "desc": "解决什么问题：AI 生成视频分辨率低、有 AI 味——观众一眼看出是 AI 做的。真方法：按场景选择修复模型，将修复流程封装为可复用技能。"}, {"id": "39-5.5", "label": "5.5 精准控图——具体元素描述替代抽象概念", "type": "method", "file": "成长系统/39_514视频实战经验方法论文集_v1.md", "anchor": "方法 5.5", "desc": "解决什么问题：AI 生成内容不可控、抽卡式出图——描述\"高级感\"AI 不知道是什么。真方法：描述具体画面元素，运用设计原则。"}, {"id": "39-5.6", "label": "5.6 数字人口播——一张照片搞定", "type": "method", "file": "成长系统/39_514视频实战经验方法论文集_v1.md", "anchor": "方法 5.6", "desc": "解决什么问题：不想露脸拍摄口播或分身视频。真方法：用一张照片和 AI 工具快速生成口型、表情、动作匹配的数字人。"}, {"id": "39-5.7", "label": "5.7 低成本创意——几毛钱道具 + 免费模型", "type": "method", "file": "成长系统/39_514视频实战经验方法论文集_v1.md", "anchor": "方法 5.7", "desc": "解决什么问题：个人创作者预算有限但想提升视频创意。真方法：用物理道具 + 后期抠图或免费 AI 模型，替代昂贵设备和专业软件。"}]}, {"id": "39-六、自媒", "label": "六、自媒体·获客运营 📣（7 簇 → 4 法）🟡", "type": "cat39", "desc": "4 条方法", "children": [{"id": "39-6.1", "label": "6.1 AI 自动化 SOP——把内容生产变成流水线", "type": "method", "file": "成长系统/39_514视频实战经验方法论文集_v1.md", "anchor": "方法 6.1", "desc": "解决什么问题：个人创作者依赖灵感、效率低。真方法：用 AI 工具搭建可复制的自动化内容生产流程，把选题、素材、创作、归档等环节标准化。"}, {"id": "39-6.2", "label": "6.2 AI 实用化——从刷视频到用 AI 干活", "type": "method", "file": "成长系统/39_514视频实战经验方法论文集_v1.md", "anchor": "方法 6.2", "desc": "解决什么问题：人们花大量时间刷短视频却无产出、效率低下。真方法：主动用 AI 工具解决具体任务，而非被动消费内容。"}, {"id": "39-6.3", "label": "6.3 博主身份的社会资本积累——不为涨粉为背书", "type": "method", "file": "成长系统/39_514视频实战经验方法论文集_v1.md", "anchor": "方法 6.3", "desc": "解决什么问题：普通人做自媒体目标错位、难以持续。真方法：明确做小博主的目的是积累社会身份资本，为求职、合作、社交加分，而非单纯追求粉丝量。"}, {"id": "39-6.4", "label": "6.4 视觉稳定与算法适应——专业原创吃流量", "type": "method", "file": "成长系统/39_514视频实战经验方法论文集_v1.md", "anchor": "方法 6.4", "desc": "解决什么问题：AI 生成视频时画面抽卡、角色不一致；新算法下流量获取不确定。真方法：用故事板+角色设定图稳定生成；用专业原创内容适配算法。"}]}, {"id": "39-七、效率", "label": "七、效率工具·知识管理 🧰（7 簇 → 6 法）⚪", "type": "cat39", "desc": "6 条方法", "children": [{"id": "39-7.1", "label": "7.1 Obsidian 统一归档——一个入口收所有平台", "type": "method", "file": "成长系统/39_514视频实战经验方法论文集_v1.md", "anchor": "方法 7.1", "desc": "解决什么问题：收藏内容分散在微信、知乎、微博、抖音，难以查找。真方法：通过一个入口将各平台内容自动同步到 Obsidian，实现私有化归档。"}, {"id": "39-7.2", "label": "7.2 本地 AI 知识库——Obsidian + Ollama + DeepSeek", "type": "method", "file": "成长系统/39_514视频实战经验方法论文集_v1.md", "anchor": "方法 7.2", "desc": "解决什么问题：云端 AI 无法访问个人笔记——你问它\"我之前记的那个 XXX\"它答不上。真方法：通过本地部署 AI 模型，让 AI 基于私有笔记进行精准问答。"}, {"id": "39-7.3", "label": "7.3 豆包四步法——快速掌握陌生领域", "type": "method", "file": "成长系统/39_514视频实战经验方法论文集_v1.md", "anchor": "方法 7.3", "desc": "解决什么问题：面对陌生领域无从下手——不知道从哪开始、不知道信什么信息。真方法：通过\"提问-溯源-梳理-输出\"四步，快速建立认知框架。"}, {"id": "39-7.4", "label": "7.4 移动端 AI——手机也能跑 Agent", "type": "method", "file": "成长系统/39_514视频实战经验方法论文集_v1.md", "anchor": "方法 7.4", "desc": "解决什么问题：AI 工具受限于电脑端——出差路上、车上、地铁里想用 AI 没办法。真方法：通过 Harness 工具在手机端直接使用。"}, {"id": "39-7.5", "label": "7.5 零代码 AI 应用生成——豆包电脑版内置", "type": "method", "file": "成长系统/39_514视频实战经验方法论文集_v1.md", "anchor": "方法 7.5", "desc": "解决什么问题：非程序员无法开发软件——想做个小工具不会写代码。真方法：通过 AI 编程工具，零基础也能生成并运行小游戏、图表和完整项目。"}, {"id": "39-7.6", "label": "7.6 场景定制 AI 工具——教学与办公", "type": "method", "file": "成长系统/39_514视频实战经验方法论文集_v1.md", "anchor": "方法 7.6", "desc": "解决什么问题：通用工具不贴合特定场景——通用 CRM 满足不了你的细分需求。真方法：通过 AI 定制开发教学或办公工具。"}]}, {"id": "39-八、AI", "label": "八、AI 认知·趋势·观点 🧠（7 簇 → 6 法）★", "type": "cat39", "desc": "6 条方法", "children": [{"id": "39-8.1", "label": "8.1 AI 驱动学习——从系统教程到对话学习", "type": "method", "file": "成长系统/39_514视频实战经验方法论文集_v1.md", "anchor": "方法 8.1", "desc": "解决什么问题：AI 时代如何高效学习与自我提升——传统系统教程跟不上技术迭代。真方法：不再依赖系统教程，通过主动向 AI 提问、承认无知并构建对话来获取定制化知识。"}, {"id": "39-8.2", "label": "8.2 AI 重塑内容生产工作流——端到端自动化", "type": "method", "file": "成长系统/39_514视频实战经验方法论文集_v1.md", "anchor": "方法 8.2", "desc": "解决什么问题：视频、字幕、动效等创意内容制作效率低下。真方法：利用 AI 工具实现从素材到成品的端到端自动化处理，而非单点辅助。"}, {"id": "39-8.3", "label": "8.3 个人风格库与模板库——告别 AI 味", "type": "method", "file": "成长系统/39_514视频实战经验方法论文集_v1.md", "anchor": "方法 8.3", "desc": "解决什么问题：AI 生成内容千篇一律、缺乏个人特色。真方法：为 AI 建立有品位的风格库和可复用的经验模板。"}, {"id": "39-8.4", "label": "8.4 识别 AI 商业机会与风险边界", "type": "method", "file": "成长系统/39_514视频实战经验方法论文集_v1.md", "anchor": "方法 8.4", "desc": "解决什么问题：在 AI 浪潮中把握商业机遇同时规避重大风险。真方法：既要看到数据、Token 等新资产和疗愈等新赛道的潜力，也要警惕技术夸大和合规红线。"}, {"id": "39-8.5", "label": "8.5 洞察 AI 宏观趋势与竞争格局", "type": "method", "file": "成长系统/39_514视频实战经验方法论文集_v1.md", "anchor": "方法 8.5", "desc": "解决什么问题：理解 AI 发展宏观态势、指导个人与企业战略定位。真方法：关注中美 AI 竞争焦点从模型能力转向生态、价格与应用落地，并理解 Token 的战略资源属性。"}, {"id": "39-8.6", "label": "8.6 AI 辅助创意实现与作品打磨", "type": "method", "file": "成长系统/39_514视频实战经验方法论文集_v1.md", "anchor": "方法 8.6", "desc": "解决什么问题：个人创作者将创意快速转化为可交互作品或精致内容。真方法：利用 AI 3D 工具和免费模型，降低技术门槛，让普通人也能实现高质感创意。"}]}, {"id": "39-九、自己", "label": "九、自己的内容资产 📦（6 簇 → 6 法）⚪", "type": "cat39", "desc": "6 条方法", "children": [{"id": "39-9.1", "label": "9.1 微信 AI 零门槛——日常文件图片处理", "type": "method", "file": "成长系统/39_514视频实战经验方法论文集_v1.md", "anchor": "方法 9.1", "desc": "解决什么问题：普通人不想下载软件、不会 PS 也能处理文档和图片。真方法：直接用微信自带 AI 读取聊天文件或改图加字。"}, {"id": "39-9.2", "label": "9.2 驯服 AI 先喂身份再装技能", "type": "method", "file": "成长系统/39_514视频实战经验方法论文集_v1.md", "anchor": "方法 9.2", "desc": "解决什么问题：普通人不知道如何让 AI 听话干活——AI 答非所问、推荐不对路。真方法：先给 AI 设定身份信息，再逐步添加技能，每次开新对话，边学边用。"}, {"id": "39-9.3", "label": "9.3 免费 Token 体验多 Agent", "type": "method", "file": "成长系统/39_514视频实战经验方法论文集_v1.md", "anchor": "方法 9.3", "desc": "解决什么问题：零成本尝试 AI 自动化——担心学完才发现要花很多钱。真方法：利用腾讯 Marvis 每天赠送的免费 Token，体验多 Agent 协作。"}, {"id": "39-9.4", "label": "9.4 电商人选 AI 工具的正确姿势", "type": "method", "file": "成长系统/39_514视频实战经验方法论文集_v1.md", "anchor": "方法 9.4", "desc": "解决什么问题：电商人选 AI 工具时不知选哪款、怎么问。真方法：关键看工具匹配度和提问方式，推荐阿里悟空免费生成主图。"}, {"id": "39-9.5", "label": "9.5 AI 自动化抢码与情感互动", "type": "method", "file": "成长系统/39_514视频实战经验方法论文集_v1.md", "anchor": "方法 9.5", "desc": "解决什么问题：手速不够抢不到邀请码；以及让科技服务情感表达。真方法：用 AI 自动化技能定时刷新抢码，或用填空互动生成信件。"}, {"id": "39-9.6", "label": "9.6 从一件小事开始成为 AI 使用者", "type": "method", "file": "成长系统/39_514视频实战经验方法论文集_v1.md", "anchor": "方法 9.6", "desc": "解决什么问题：观望者迟迟不敢行动——总觉得要先学完才能用。真方法：别纠结天赋，从一件具体小事开始用 AI，逐步从观望者变成使用者。"}]}]}, {"id": "40", "label": "40 视频补缺方法论（16 条）", "type": "doc", "desc": "514 视频核心 3 类 64 条全文精读出的、没被 39 归纳进去的散点经验", "file": "成长系统/40_514视频补缺方法论_v1.md", "children": [{"id": "40-A1", "label": "A1 Skill 产品化：把交付沉淀成可重复销售的 Skill 套件", "type": "gap", "desc": "作者说了什么： 智群 Ai《微信公众号 AI 运营 Skill 套件》里，把\"公众号运营者的一整套日常工作（选题调研→文章写作→审稿校对→排版→马克档）\"封装成一套\"按流程干活的公众号数字员工\"。用法：直接用微信 API 发布、多帐号管理，整体打包在一套 AI Agent 工作流里——交付一次，后续可重复卖给同类公众号。", "file": "成长系统/40_514视频补缺方法论_v1.md", "anchor": "A1"}, {"id": "40-A2", "label": "A2 农业垂类落地的\"刚性自动化+AI降门槛\"五件套", "type": "gap", "desc": "作者说了什么： 单车酒吧搞机社《AI+智慧农业落地全纪实》讲了一个新疆棉花基地（80% 棉田）的真实落地方案。客户原话\"想用 AI 全部替代人力\"，作者没有直接答应，先讲 AI 局限（农业不能试错，CV/大模型都不能 100%），再给出 5 步方案：①先做刚性自动化（把农艺专家经验写成固定代码——土壤湿度<阈值+在浇水时段+水位够→自动开阀提水灌盖关阀，不依赖 AI 推理）②本地部署保稳定（所有决", "file": "成长系统/40_514视频补缺方法论_v1.md", "anchor": "A2"}, {"id": "40-A3", "label": "A3 AI 原生组织的\"认知节点 + 端到端反馈\"双指标", "type": "gap", "desc": "作者说了什么： 曾鸣（智能体/北京观塘智）《AI原生组织长什么样》提出两个判断： 未来组织只做两件事——①运营自动化 ②战略决策高质量化。AI 原生不是\"把 AI 当工具\"，而是\"以 AI 为起点设计全部工作流\"，目标就是把人踢下来，越快越好（Tesla FSD 端到端路线）——只要人在中间效率立马打折。 组织的最小单元不再是\"岗位\"，而是\"认知节点\"（你能干啥活 = 你的能力单元 = 你能不能被", "file": "成长系统/40_514视频补缺方法论_v1.md", "anchor": "A3"}, {"id": "40-A4", "label": "A4 B 端获客的\"培训即获客\"低成本打法", "type": "gap", "desc": "作者说了什么： 清华鑫哥讲 AI 智能体《做了 1 年 B 端 Agent 搭建，踩坑无数，总结出来七条血泪经验》里第 4 条原话：\"培训是最便宜的获客——给企业做一场 AI 的内训，台下坐的全是各个部门的负责人，课讲完，需求往往自己就冒出来了。我之前手上一半的交付项目，源头其实都来自于每一场的培训，有的是这个付费的内训。\"", "file": "成长系统/40_514视频补缺方法论_v1.md", "anchor": "A4"}, {"id": "40-A5", "label": "A5 销售型企业 AI 落地的\"权力回收\"叙事", "type": "gap", "desc": "作者说了什么： 皮皮《FDE 凭什么月入 10 万？真正值钱的根本不是 AI》里讲到一个中型外贸公司的真实案例：客户原有流程是销售提单→法务确认→财务确认→销售 VP 审核——本质是\"责任分摊 + 权力分摊\"，销售 VP 即使同意也得等下面过一遍才能批，法务/财务都不敢放权给 AI。作者团队做了一套 AI 系统，把审批逻辑变成 AI 综合评判（销售需求+财务能力+法务能力+部门完成度），最终结果只", "file": "成长系统/40_514视频补缺方法论_v1.md", "anchor": "A5"}, {"id": "40-B1", "label": "B1 获客型短视频的\"问题+解法+方案\"三段式", "type": "gap", "desc": "作者说了什么： 余敖 IP 商业修行《获客型短视频怎么做？》提出获客型短视频的底层逻辑 = 问题 + 解法 + 方案，跟\"痛点-恐吓-展示\"完全不同： 问题 = 即刚的痛点：不是所有痛点都值得做选题，只有目标客户在决策过程中愿意付费解决的才叫即刚（如定位纠偏、战略卡点）。客户自己会做的不付费（基础调研）。 解法 = 讲思考路径：别给标准答案，用\"错在哪 → 为什么 → 怎么做\"结构（先讲反常识错误", "file": "成长系统/40_514视频补缺方法论_v1.md", "anchor": "B1"}, {"id": "40-B2", "label": "B2 能力-变现匹配的\"四类人四类内容\"框架", "type": "gap", "desc": "作者说了什么： 郑经说《对号入座：你适合卖什么产品，做什么内容？》给出四类人对应四类变现： 逻辑能力强 → 适合卖课 → 内容讲方法论 判断力强 → 适合卖咨询和诊断 → 内容讲卡点和卡点后的判断 执行力强 → 适合做陪跑 → 内容讲流程和案例 什么能力都没有 → 先找一个生意先做起来再说（不卖课不卖咨询，先做业务）", "file": "成长系统/40_514视频补缺方法论_v1.md", "anchor": "B2"}, {"id": "40-B3", "label": "B3 独立开发者的\"vibe coding 11 步\"全流程", "type": "gap", "desc": "作者说了什么： 光羽的平行世界《一个人一台电脑 年收入超 1000 万》采访刘小排（中国独立开发者，年入千万），他把自己的工作拆成 11 步： 找需求：自己先发现一个别人没注意到的细分痛点 AI 当产品经理：把想法丢给 DeepSeek/ChatGPT，让它联网查竞品评估机会，写成需求文档 AI 做原型：先在纸上画界面 → 让 AI 生成高保真原型 → 发给目标用户确认 AI 写代码：用中文提需求", "file": "成长系统/40_514视频补缺方法论_v1.md", "anchor": "B3"}, {"id": "40-B4", "label": "B4 提示词\"提问式学习\"哲学", "type": "gap", "desc": "作者说了什么： 趙亮《AI 提示词和提问有什么不同？》核心观点：①提示词是给机器看的\"需求说明书\"，本质是用机器最懂的结构化语言，把商业场景的定量和变量全部写清楚（不反过）②普通老板用 AI 听不进去，是因为 AI 给的回答是\"专业语言\"——你能把它翻译成\"有趣的人话\"才有价值③商用级提示词叫\"提示工程\"，跟写代码一样需要逻辑和结构，不是随便聊天。他的一条提示词能卖 5000-20000 元。", "file": "成长系统/40_514视频补缺方法论_v1.md", "anchor": "B4"}, {"id": "40-C1", "label": "C1 AI 深度内容策划的\"五步提纲+复盘\"", "type": "gap", "desc": "作者说了什么： 脱不花《我怎么用 AI 策划《长谈》》讲的是长访谈类深度内容的 AI 工作流——不是普通自媒体，是 5 万字/期、单期成本十几万的访谈节目级内容： 嘉宾研究：让 AI 扫嘉宾所有公开表达，找出\"跟他有关但从未被问过\"的问题，从这撕口子。 全球对标：让 AI 自动找全球身份类似的人，看顶级访谈节目聊了什么——几小时拿到一张\"对标地图\"。 访谈技术对标：让 AI 对比奥普拉、马克·马龙", "file": "成长系统/40_514视频补缺方法论_v1.md", "anchor": "C1"}, {"id": "40-C2", "label": "C2 AI 时代的\"4 本书思维方法论\"", "type": "gap", "desc": "作者说了什么： 我是宋玥《AI 时代需要重新读的书》推荐 4 本书，每本对应一种 AI 时代核心能力： 《金字塔原理》（麦肯锡）：把模糊需求拆成论点+论据，用结构化思维跟 AI 沟通——AI 不会替你思考模糊，但你能用金字塔原理先想清楚再问。 《学会提问》（批判性思维）：问题的质量决定答案的质量。AI 一分钟给你 20 个方案，但你的时间没多——问对问题比工具重要。 《精要主义》（更少但更好）：A", "file": "成长系统/40_514视频补缺方法论_v1.md", "anchor": "C2"}, {"id": "40-C3", "label": "C3 顶尖专家 vs 通才的\"红沟\"判断", "type": "gap", "desc": "作者说了什么： 昌健胡说转述李飞飞（斯坦福 AI 教母）核心判断：AI 时代，人和人的差距是\"红沟\"——主动用 AI 造东西的人越用越有底气；被动等别人告诉的人越等越没底气。李飞飞提出未来两类最值钱的人： 行业顶尖 1% 专家：单领域钻得深到 AI 替代不了（如顶级律师、医生、投资人） 判断力超强的通才：什么都能上手，敢拿主意，靠 AI 跨过专业之间的墙——一个人推动一个完整项目", "file": "成长系统/40_514视频补缺方法论_v1.md", "anchor": "C3"}, {"id": "40-C4", "label": "C4 教育\"新内卷\"批判与本质回归", "type": "gap", "desc": "作者说了什么： 新京报/北京大学哲学系教授程乐松的核心观点：\"AI 时代真正的焦虑不是技术本身，而是孩子会不会被社会评判为'落后'，从而被踢出竞争赛道。\"他指出三个判断： AI 教育的本质错位：社会把\"会不会用 AI\"当默认技能，没条件深入学的孩子就被悄悄划入\"掉队\"群体。 新内卷的实质：家长感到的\"落后\"压迫感来自社会评价，不是技术本身。 教育的本质回归：当 AI 能力被默认为标配，\"会用 AI", "file": "成长系统/40_514视频补缺方法论_v1.md", "anchor": "C4"}, {"id": "40-C5", "label": "C5 爬虫/数据合规的\"三问自查\"红线", "type": "gap", "desc": "作者说了什么： 单律聊 AI《爬虫圈 3 大坑，踩一个赔 8 位数，踩两个进去》给出 3 个爬虫项目必答问题： 你爬的数据别人能不能直接看？——需要登录/付费/破解才能看到的数据 = 触犯刑法\"非法获取计算机信息系统数据罪\"。已有判刑案例。 你拿这些数据是干嘛的？——做\"替代品\"（用户在你这也看到原平台全部内容）= 实质性替代，B 百科爬 A 百科判赔 1500 万。做\"新东西\"（加工产生新价值）", "file": "成长系统/40_514视频补缺方法论_v1.md", "anchor": "C5"}, {"id": "40-C6", "label": "C6 知识库的\"套模板\"哲学", "type": "gap", "desc": "作者说了什么： 老周聊 AI 决策（周俊东）《低效的人遇事就查，高效的人遇事就\"套\"》核心观点： 别把知识库当\"查资料\"工具，要把它当\"套模板\"武器——用固定框架复用经验，而不是每次从零开始。 建模板库：把过去做过的成功项目、方案、流程沉淀成标准化模板，按场景分类。 遇事先\"套\"：接到新任务，先翻模板库找最接近的框架，直接套用结构，只更新里面的具体内容。 强制用模板：规定团队产出必须从模板出发，不", "file": "成长系统/40_514视频补缺方法论_v1.md", "anchor": "C6"}, {"id": "40-C7", "label": "C7 鉴别 AI 营销号与\"能力边界判断\"", "type": "gap", "desc": "作者说了什么： 不过几千寒热《Claude 做神级网页？一键轻轻松松？》核心观点：当前 AI 根本做不出 Lucin、60fps 等顶级工作室的 3D 交互动效网页，那些炫酷作品被某些博主截图后声称\"我用 Codex/CloudCode 做的\"，评论区没人质疑。 判断 AI 能力边界：看到炫酷 3D/交互动效网页，先默认是专业团队作品，别轻信\"AI 一键生成\"。 验证信息来源：用截图反向搜图，或查", "file": "成长系统/40_514视频补缺方法论_v1.md", "anchor": "C7"}]}, {"id": "41", "label": "41 方法论三件套 MECE 汇总", "type": "doc", "desc": "38/39/40 为什么不重不漏 + 怎么配合用", "file": "成长系统/41_方法论三件套MECE汇总_v1.md"}, {"id": "42", "label": "42 全景地图收口审计（为什么这么设计）", "type": "doc", "desc": "10 个地图文档的图鉴 + 设计理由 + 权威等级 + 缺口", "file": "成长系统/42_全景地图收口审计与总图_v1.md"}]}, {"id": "C", "label": "C 三张视角地图", "type": "branch", "desc": "同一件事的三种问法，互斥且穷尽：业务（怎么接单）／工程（怎么做出来）／权威（凭什么信）", "children": [{"id": "09", "label": "09 业务地图（7 阶段 37 关卡）", "type": "doc", "desc": "接客户到规模化的业务侧全景", "file": "成长系统/09_企业AI落地全流程关卡地图_v1.md", "children": [{"id": "09-阶段 1：接", "label": "阶段 1：接客户 / 需求澄清", "type": "leaf", "file": "成长系统/09_企业AI落地全流程关卡地图_v1.md", "anchor": "阶段 1：接客户 / 需求澄清"}, {"id": "09-阶段 2：技", "label": "阶段 2：技术选型 / 框架设计", "type": "type": "dom", "children": [{"id": "f-DATA-001-企业数据治理与两周MVD", "label": "DATA-001 企业数据治理与两周MVD", "type": "fcard", "desc": "企业 AI 项目 70% 败在数据（Rand 调查）——本卡解决「进场第一周怎么把客户数据盘清楚、判断能不能做、并选出离钱最近的两周 MVD 场景」，同时不忽悠客户上重平台（第一单不上 Kafka+数仓全家桶是红线）。", "file": "foundations/DATA/DATA-001-企业数据治理与两周MVD.md"}]}, {"id": "dom-ECO", "label": "ECO（1）", "type": "dom", "children": [{"id": "f-ECO-001生态与工具", "label": "ECO-001 生态与工具", "type": "fcard", "desc": "1. 模型选型：主力模型是闭源旗舰（GPT/Claude）还是开源自托管（DeepSeek/MiniMax）？按量 vs 包月？", "file": "foundations/ECO/ECO-001生态与工具.md"}]}, {"id": "dom-EVAL", "label": "EVAL（4）", "type": "dom", "children": [{"id": "f-EVAL-001-效果评估", "label": "EVAL-001 效果评估", "type": "fcard", "desc": "效果评估解决的是「AI 项目从'看着像有用'到'真的有用'的可证明转换」——用一组标准场景（黄金集）+ 量化指标（命中率、转化率、回归通过率）+ 真实业务验收（真烧积分、真上线、真出单），把模糊的「效果不错」翻译成可追责的数字。", "file": "foundations/EVAL/EVAL-001-效果评估.md"}, {"id": "f-EVAL-002-高级效果评估", "label": "EVAL-002 高级效果评估（v2.0 增强版）", "type": "fcard", "desc": "高级效果评估解决的是「AI 项目从 demo 跑通到客户愿意续约、愿意付更多钱、愿意推荐给同行」的全链路度量——用北极星指标牵引方向，用 Jobs-to-be-Done 校准真实价值，用业务指标体系量化客户终身价值。", "file": "foundations/EVAL/EVAL-002-高级效果评估.md"}, {"id": "f-EVAL-003-AI应用评测与可观测：上线前必须有的保障", "label": "[候选] AI 应用评测与可观测:上线前必须有的保障", "type": "fcard", "desc": "收录时间:2026-09-03", "file": "foundations/EVAL/EVAL-003-AI应用评测与可观测：上线前必须有的保障.md"}, {"id": "f-EVAL-004-评测集建设与偏见审计", "label": "EVAL-004 评测集建设与偏见审计", "type": "fcard", "desc": "评测集是 AI 项目的「考卷」——考卷出得烂（太简单/有标准答案泄漏/只覆盖一种客户），AI 考 100 分也没用。本卡解决考卷本身的质量：来源、规模、分布、标注、更新、防泄漏、防偏见，让「离线评测通过」真的能预示「上线能打」。", "file": "foundations/EVAL/EVAL-004-评测集建设与偏见审计.md"}]}, {"id": "dom-FDE", "label": "FDE（4）", "type": "dom", "children": [{"id": "f-FDE-001-角色定义与边界", "label": "FDE-001 角色定义与边界", "type": "fcard", "desc": "FDE（Forward Deployed Engineer, 前线部署工程师）解决的，是「企业花几百万美元买人工智能系统、却没有人真的用起来」这道鸿沟——派最会写代码的人，扎进客户真实业务现场，把模型塞进工作流里，直到客户自己的组织行为发生可度量的改变。", "file": "foundations/FDE/FDE-001-角色定义与边界.md"}, {"id": "f-FDE-002-FDE六阶段旅程", "label": "FDE-002 FDE 六阶段旅程", "type": "fcard", "desc": "FDE 的工作不是「接单 → 交付 → 收钱」的一次性交易，而是沿着六阶段闭环「找问题→赢客户→激活→续约→扩收→规模化复制」不断把单点价值沉淀为可复用资产——客户在长大，组织也在长大，离开时留下的不只是合同，而是平台更厚、团队更强、行业地位更稳。", "file": "foundations/FDE/FDE-002-FDE六阶段旅程.md"}, {"id": "f-FDE-004-12-Factor Agents：把 Agent 当可靠生产系统设计的 12 条真实原则", "label": "12-Factor Agents：把 Agent 当可靠生产系统设计的 12 条真实原则", "type": "fcard", "desc": "审核时间：2026-09-03 19:54", "file": "foundations/FDE/FDE-004-12-Factor Agents：把 Agent 当可靠生产系统设计的 12 条真实原则.md"}, {"id": "f-M-FDE-001-企业AI落地第一性原理", "label": "M-FDE-001 企业AI落地第一性原理（范冰《前线部署工程师》读书沉淀）", "type": "fcard", "desc": "状态：✅ 已审核（升格为正式方法论卡）", "file": "foundations/FDE/M-FDE-001-企业AI落地第一性原理.md"}]}, {"id": "dom-ITER", "label": "ITER（1）", "type": "dom", "children": [{"id": "f-ITER-001-反馈闭环与度量驱动改进", "label": "ITER-001 反馈闭环与度量驱动改进", "type": "fcard", "desc": "「做完就完了」是大多数团队的通病——项目交付后不度量、不复盘、不把教训变成下一轮的输入，导致同样的坑反复踩。反馈闭环解决的是：用什么度量、怎么收集反馈、怎么让教训真正改进行为，让每个项目都比上一个更稳。", "file": "foundations/ITER/ITER-001-反馈闭环与度量驱动改进.md"}]}, {"id": "dom-MLOPS", "label": "MLOPS（1）", "type": "dom", "children": [{"id": "f-MLOPS-001-模型运维与漂移监控", "label": "MLOPS-001 模型运维与漂移监控", "type": "fcard", "desc": "AI 系统上线不是结束而是开始——模型会漂移（数据变了/业务变了/世界变了），今天 95 分准确率的系统半年后可能只剩 70 分还不自知。模型运维解决：怎么发现模型变差、怎么回滚、怎么让系统持续自我改进，防止「上线即巅峰、之后悄悄烂掉」。", "file": "foundations/MLOPS/MLOPS-001-模型运维与漂移监控.md"}]}, {"id": "dom-ORG", "label": "ORG（1）", "type": "dom", "children": [{"id": "f-ORG-001组织与团队", "label": "ORG-001 组织与团队", "type": "fcard", "desc": "组织解决的是「人多了之后怎么不互相拖累」——从单兵到小团队到跨职能团队，每次跨越都要重新设计决策权、沟通路径、交接标准，否则效率与人数成反比。", "file": "foundations/ORG/ORG-001组织与团队.md"}]}, {"id": "dom-POC", "label": "POC（1）", "type": "dom", "children": [{"id": "f-POC-001-POC与MVP验证", "label": "POC-001 · POC 与 MVP 验证", "type": "fcard", "desc": "*怎么用 1-2 周证明「这件事值得做」，又不被客户的「改 3 版 POC」拖死。", "file": "foundations/POC/POC-001-POC与MVP验证.md"}]}, {"id": "dom-PRICE", "label": "PRICE（1）", "type": "dom", "children": [{"id": "f-PRICE-001定价与商业化", "label": "PRICE-001 定价与商业化", "type": "fcard", "desc": "定价解决的是「客户付得起、自己赚得到、长期能涨」三方平衡——用一组合适的定价模型 + 心理锚点 + 价值计量，让单笔交易变成长期关系。", "file": "foundations/PRICE/PRICE-001定价与商业化.md"}]}, {"id": "dom-REL", "label": "REL（1）", "type": "dom", "children": [{"id": "f-REL-001-可靠性与自愈", "label": "REL-001 可靠性与自愈", "type": "fcard", "desc": "可靠性解决的是「系统在没人看着的时候，能不能自己继续把事做完、并在坏掉的时候自己爬起来」——把人工运维压到极限，同时让单点故障不变成服务中断。", "file": "foundations/REL/REL-001-可靠性与自愈.md"}]}, {"id": "dom-REQ", "label": "REQ（1）", "type": "dom", "children": [{"id": "f-REQ-001-需求工程", "label": "REQ-001 需求工程", "type": "fcard", "desc": "需求工程是把「客户模糊的痛」（客服成本高/文档查不到/质检靠人眼）翻译成「机器可验收的规格」（场景+输入+输出+验收标准），并管理后续变更——AI 项目 95% 的失败不在模型，在没把问题定义到「不记反馈、不存上下文、不进工作流」这层（MIT NANDA 报告，范冰书引用）。", "file": "foundations/REQ/REQ-001-需求工程.md"}]}, {"id": "dom-RETIRE", "label": "RETIRE（1）", "type": "dom", "children": [{"id": "f-RETIRE-001-退役合规清单", "label": "RETIRE-001 退役合规清单", "type": "fcard", "desc": "项目总有结束的一天——客户不续约、系统被替换、试用到期。退役不是「把服务关掉」那么简单：数据怎么删干净、合同怎么收尾、客户团队会不会断粮、我们自己的后台任务会不会变成幽灵进程。退役合规清单让收尾「体面、干净、无遗留」。", "file": "foundations/RETIRE/RETIRE-001-退役合规清单.md"}]}, {"id": "dom-SALES", "label": "SALES（2）", "type": "dom", "children": [{"id": "f-SALES-001销售与增长", "label": "SALES-001 销售与增长", "type": "fcard", "desc": "销售与增长解决的是「让对的人在对的时机以对的方式听到对的承诺，然后自然走到签单」——不是 push 客户买，而是设计一条客户愿意走的路。", "file": "foundations/SALES/SALES-001销售与增长.md"}, {"id": "f-SALES-002-企业语音多平台获客实战手册", "label": "企业语音多平台获客实战手册", "type": "fcard", "desc": "不是「如何用 AI 写文案」，而是「怎么用 AI 把企业项目第一次卖出去」。", "file": "foundations/SALES/SALES-002-企业语音多平台获客实战手册.md"}]}]}, {"id": "E", "label": "E 决策卡（7 张）", "type": "branch", "desc": "带档位+价格+适用边界，可直接拿出跟客户谈", "children": [{"id": "d-ALT-001-中俄跨境电商获客", "label": "决策卡 ALT-001 · 中俄跨境电商获客（VK主力）", "type": "dcard", "desc": "*你做跨境电商/物流/外贸，想找俄罗斯客户 → 这张卡为你准备的。", "file": "cards/ALT-001-中俄跨境电商获客.md"}, {"id": "d-AR-003-顾问式AI架构决策", "label": "AR-003 · 顾问式 AI 架构决策（企业零基础版）", "type": "dcard", "desc": "*客户是完全公司「零 AI 经验」企业（传统制造业/服务业/医疗），来问你「我们 AI 该怎么搞」——这张卡告诉你「先聊什么 + 用什么做样板 + 报价哪一档 + 怎么让客户买单」。", "file": "cards/AR-003-顾问式AI架构决策.md"}, {"id": "d-ENTERPRISE-001-近企业档决策卡", "label": "ENTERPRISE-001 · 近企业档决策卡（多平台 + 多团队 + 审计）", "type": "dcard", " /* ---------- 布局: 简洁横向树 ---------- */
var layoutNodes = [], layoutLinks = [];
function layout(){
  layoutNodes = []; layoutLinks = [];
  var y = 0;
  function walk(n, depth, parent){
    var kids = visibleKids(n);
    var w = NW[n.type] || 230;
    var node = {n:n, depth:depth, x:depth*300, y:0, w:w, h:NH, parent:parent, kids:kids};
    if(kids.length){
      var startY = y;
      kids.forEach(function(ch){ walk(ch, depth+1, node); });
      node.y = (startY + y - VGAP) / 2;
    } else {
      node.y = y; y += NH + VGAP;
    }
    layoutNodes.push(node);
    if(parent) layoutLinks.push({p:parent, c:node});
    return node;
  }
  y = 0;
  walk(DATA, 0, null);
}

/* ---------- 渲染 ---------- */
var NS = "http://www.w3.org/2000/svg";
function el(t, a){ var e = document.createElementNS(NS, t); for(var k2 in a) e.setAttribute(k2, a[k2]); return e; }
function trunc(s, n){ return s.length > n ? s.slice(0, n-1) + "…" : s; }

function render(){
  layout();
  var lg = document.getElementById("links"), ng = document.getElementById("nodes");
  lg.innerHTML = ""; ng.innerHTML = "";
  // links
  layoutLinks.forEach(function(l){
    var x1 = l.p.x + l.p.w, y1 = l.p.y + NH/2, x2 = l.c.x, y2 = l.c.y + NH/2;
    var mx = (x1 + x2) / 2;
    var p = el("path", {class:"link", d:"M"+x1+","+y1+" C"+mx+","+y1+" "+mx+","+y2+" "+x2+","+y2});
    lg.appendChild(p);
  });
  // nodes
  layoutNodes.forEach(function(nd){
    var n = nd.n;
    var g = el("g", {class:"node n-" + n.type + (sel && sel.id === n.id ? " sel" : "")});
    g.setAttribute("transform", "translate(" + nd.x + "," + nd.y + ")");
    g.appendChild(el("rect", {class:"box", x:0, y:0, width:nd.w, height:NH, rx:11}));
    g.appendChild(el("rect", {class:"acc", x:3, y:7, width:3, height:NH-14, rx:1.5,
      fill:(COLORS[n.type] || COLORS.dflt), opacity:.9}));
    var t = el("text", {class:"lab", x:15, y:19});
    t.textContent = trunc(n.label, Math.floor((nd.w-30)/6.6));
    g.appendChild(t);
    if(n.badge){
      var b = el("text", {class:"sub", x:15, y:29});
      b.textContent = n.badge;
      g.appendChild(b);
    }
    if(n.children && n.children.length){
      var tg = el("g", {class:"tgl"});
      tg.setAttribute("transform", "translate(" + (nd.w - 15) + ",9)");
      tg.appendChild(el("rect", {width:12, height:12, rx:3}));
      var s = el("text", {class:"tsig", x:6, y:10});
      s.textContent = isOpen(n) ? "–" : "+";
      tg.appendChild(s);
      tg.addEventListener("click", function(ev){ ev.stopPropagation(); toggle(n.id); });
      g.appendChild(tg);
    }
    g.addEventListener("click", function(){ pick(n, nd); });
    ng.appendChild(g);
  });
  applyT();
}

function applyT(){ document.getElementById("world").setAttribute("transform", "translate("+tx+","+ty+") scale("+k+")"); }

function toggle(id){
  if(collapsed[id]) delete collapsed[id]; else collapsed[id] = true;
  render(); if(sel) drawSide(sel);
}

/* ---------- 交互: 缩放/平移 (鼠标 + 触摸) ---------- */
var cv = document.getElementById("canvas");
function zoomAt(mx, my, f){
  var nk = Math.max(0.12, Math.min(3.2, k * f));
  tx = mx - (mx - tx) * (nk / k); ty = my - (my - ty) * (nk / k); k = nk; applyT();
}
cv.addEventListener("wheel", function(e){
  e.preventDefault();
  var r = cv.getBoundingClientRect();
  zoomAt(e.clientX - r.left, e.clientY - r.top, e.deltaY < 0 ? 1.12 : 1/1.12);
}, {passive:false});
/* 鼠标拖拽 */
var dragging = false, sx = 0, sy = 0, stx = 0, sty = 0;
cv.addEventListener("mousedown", function(e){
  if(e.target.closest(".node")) return;
  dragging = true; sx = e.clientX; sy = e.clientY; stx = tx; sty = ty; cv.classList.add("drag");
});
window.addEventListener("mousemove", function(e){
  if(!dragging) return;
  tx = stx + (e.clientX - sx); ty = sty + (e.clientY - sy); applyT();
});
window.addEventListener("mouseup", function(){ dragging = false; cv.classList.remove("drag"); });
/* 触摸: 单指平移 + 双指捏合缩放(手机/平板) */
var touching = false, pinchD = 0, pinchK = 1;
function tdist(t){ return Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY); }
cv.addEventListener("touchstart", function(e){
  if(e.target.closest(".node")) return;
  if(e.touches.length === 1){
    touching = true; pinchD = 0;
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; stx = tx; sty = ty;
  } else if(e.touches.length === 2){
    touching = true; pinchD = tdist(e.touches); pinchK = k;
    sx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
    sy = (e.touches[0].clientY + e.touches[1].clientY) / 2;
    stx = tx; sty = ty;
  }
}, {passive:true});
cv.addEventListener("touchmove", function(e){
  if(!touching) return;
  e.preventDefault();
  var r = cv.getBoundingClientRect();
  if(e.touches.length === 1 && pinchD === 0){
    tx = stx + (e.touches[0].clientX - sx); ty = sty + (e.touches[0].clientY - sy); applyT();
  } else if(e.touches.length === 2 && pinchD > 0){
    var d = tdist(e.touches);
    var cx = (e.touches[0].clientX + e.touches[1].clientX) / 2 - r.left;
    var cy = (e.touches[0].clientY + e.touches[1].clientY) / 2 - r.top;
    var nk = Math.max(0.12, Math.min(3.2, pinchK * (d / pinchD)));
    var pk = k; k = nk;
    tx = cx - (cx - tx) * (nk / pk); ty = cy - (cy - ty) * (nk / pk); applyT();
  }
}, {passive:false});
cv.addEventListener("touchend", function(e){
  if(e.touches.length === 0){ touching = false; pinchD = 0; }
  else if(e.touches.length === 1){
    pinchD = 0;
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; stx = tx; sty = ty;
  }
}, {passive:true});
function zoom(f){ var r = cv.getBoundingClientRect(); zoomAt(r.width/2, r.height/2, f); }
document.getElementById("bIn").onclick = function(){ zoom(1.25); };
document.getElementById("bOut").onclick = function(){ zoom(0.8); };
/* 取景: 把一组节点框进视野 */
function contentBox(nodes){
  if(!nodes.length) return null;
  return {
    x0: Math.min.apply(null, nodes.map(function(a){ return a.x; })),
    x1: Math.max.apply(null, nodes.map(function(a){ return a.x + a.w; })),
    y0: Math.min.apply(null, nodes.map(function(a){ return a.y; })),
    y1: Math.max.apply(null, nodes.map(function(a){ return a.y + NH; })),
    w: 0, h: 0
  };
}
function frameBox(b, maxK, minK){
  if(!b) return;
  b.w = b.x1 - b.x0; b.h = b.y1 - b.y0;
  var r = cv.getBoundingClientRect();
  var pad = (r.width < 900 ? 24 : 70);
  k = Math.max(minK, Math.min(maxK, Math.min((r.width - pad*2)/(b.w+1), (r.height - pad*2)/(b.h+1))));
  tx = pad + (r.width - pad*2 - b.w*k)/2 - b.x0*k;
  ty = pad + (r.height - pad*2 - b.h*k)/2 - b.y0*k;
  applyT();
}
function fit(){ frameBox(contentBox(layoutNodes), 1.15, 0.22); }
document.getElementById("bFit").onclick = fit;
function setAll(v){
  collapsed = {};
  if(v){ (function w(n){ (n.children||[]).forEach(function(c){ collapsed[c.id] = true; if(c.children && c.children.length) w(c); }); })(DATA); }
  render(); if(sel) drawSide(sel);
}
document.getElementById("bExpand").onclick = function(){ setAll(false); fit(); };
document.getElementById("bCollapse").onclick = function(){ setAll(true); fit(); };

/* ---------- 侧栏 ---------- */
function closeSide(){
  document.getElementById("side").classList.remove("on");
  document.getElementById("sideMask").classList.remove("on");
}
function drawSide(n){
  sel = n;
  document.getElementById("side").classList.add("on");
  if(window.innerWidth <= 900) document.getElementById("sideMask").classList.add("on");
  document.getElementById("sBadge").textContent = TYPELABEL[n.type] || n.type;
  document.getElementById("sTitle").textContent = n.label;
  document.getElementById("sDesc").innerHTML = n.desc ? "<p>" + n.desc.replace(/·/g, " · ") + "</p>" : "";
  document.getElementById("sFile").textContent = n.file ? ("出处：" + n.file) : "";
  var acts = document.getElementById("sActs");
  acts.innerHTML = "";
  if(n.file){
    var b = document.createElement("div"); b.className = "act"; b.textContent = "📖 打开原文";
    b.onclick = function(){ openDoc(n.file, n.anchor, n.label); };
    acts.appendChild(b);
  }
  var kidsEl = document.getElementById("sKids");
  kidsEl.innerHTML = "";
  if(n.children && n.children.length){
    kidsEl.innerHTML = '<div class="t">子节点（'+n.children.length+'）· 点开跳到该节点</div>';
    n.children.forEach(function(c){
      var ch = document.createElement("span"); ch.className = "chip"; ch.textContent = trunc(c.label, 26);
      ch.onclick = function(){ pick(c, null); };
      kidsEl.appendChild(ch);
    });
  }
  render();
}
function pick(n, nd){
  // 点节点 = 选中 + 自动展开下一层（脑图钻取手感）
  if(n.children && n.children.length && collapsed[n.id]) delete collapsed[n.id];
  drawSide(n);
  // 放大到「以该节点为根的可读视图」——钻取时永远看得清
  fitToSub(n, nd);
}
function fitToSub(n, nd){
  var ids = {}; (function w(x){ ids[x.id] = true; visibleKids(x).forEach(w); })(n);
  var sub = layoutNodes.filter(function(a){ return ids[a.n.id]; });
  frameBox(contentBox(sub), 1.25, 0.34);
}
/* ---------- 原文 modal (极简 markdown 渲染) ---------- */
function md2html(md){
  var L = md.split("\n"), out = [], i = 0, inCode = false, codeBuf = [];
  function inline(s){
    s = s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
    s = s.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
    s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
    return s;
  }
  while(i < L.length){
    var ln = L[i];
    if(ln.trim().startsWith("```")){
      if(!inCode){ inCode = true; codeBuf = []; }
      else { inCode = false; out.push("<pre>" + codeBuf.join("\n") + "</pre>"); }
      i++; continue;
    }
    if(inCode){ codeBuf.push(ln.replace(/&/g,"&amp;").replace(/</g,"&lt;")); i++; continue; }
    if(/^\s*\|.*\|\s*$/.test(ln) && i+1 < L.length && /^\s*\|[\s:-]+\|\s*$/.test(L[i+1])){
      var rows = [];
      while(i < L.length && /^\s*\|.*\|\s*$/.test(L[i])){
        var cells = L[i].trim().replace(/^\||\|$/g, "").split("|");
        if(!/^[\s:-]+$/.test(cells[0] || "")) rows.push(cells);
        i++;
      }
      var h = "<table><tr>" + rows[0].map(function(c){ return "<th>" + inline(c.trim()) + "</th>"; }).join("") + "</tr>";
      for(var r = 1; r < rows.length; r++) h += "<tr>" + rows[r].map(function(c){ return "<td>" + inline(c.trim()) + "</td>"; }).join("") + "</tr>";
      out.push(h + "</table>"); continue;
    }
    var m;
    if((m = ln.match(/^(#{1,6})\s+(.*)$/))){ out.push("<h" + m[1].length + ">" + inline(m[2]) + "</h" + m[1].length + ">"); i++; continue; }
    if(/^\s*(---|\*\*\*)\s*$/.test(ln)){ out.push("<hr>"); i++; continue; }
    if(/^\s*>\s?/.test(ln)){ out.push("<blockquote>" + inline(ln.replace(/^\s*>\s?/, "")) + "</blockquote>"); i++; continue; }
    if(/^\s*[-*]\s+/.test(ln)){
      var li = [];
      while(i < L.length && /^\s*[-*]\s+/.test(L[i])){ li.push("<li>" + inline(L[i].replace(/^\s*[-*]\s+/, "")) + "</li>"); i++; }
      out.push("<ul>" + li.join("") + "</ul>"); continue;
    }
    if(/^\s*\d+\.\s+/.test(ln)){
      var lo = [];
      while(i < L.length && /^\s*\d+\.\s+/.test(L[i])){ lo.push("<li>" + inline(L[i].replace(/^\s*\d+\.\s+/, "")) + "</li>"); i++; }
      out.push("<ol>" + lo.join("") + "</ol>"); continue;
    }
    if(ln.trim() === ""){ i++; continue; }
    out.push("<p>" + inline(ln) + "</p>"); i++;
  }
  return out.join("\n");
}
function openDoc(file, anchor, title){
  document.getElementById("mtitle").textContent = title || file;
  document.getElementById("modal").classList.add("on");
  if(!modalOn){
    modalOn = true;
    try { history.pushState({__doc:1}, ""); } catch(e){}
  }
  var bd = document.getElementById("mbd");
  bd.innerHTML = "<p style='color:#98a1b0'>加载中… " + file + "</p>";
  fetch("obs/" + file.split("/").map(encodeURIComponent).join("/")).then(function(r){
    if(!r.ok) throw new Error("HTTP " + r.status);
    return r.text();
  }).then(function(t){
    // 去 frontmatter
    t = t.replace(/^---[\s\S]*?\n---\n/, "");
    bd.innerHTML = md2html(t);
    if(anchor){
      var hits = bd.querySelectorAll("h1,h2,h3,h4");
      for(var q = 0; q < hits.length; q++){
        if(hits[q].textContent.indexOf(anchor) >= 0 || anchor.indexOf(hits[q].textContent.trim()) >= 0){
          hits[q].scrollIntoView({block:"start"}); hits[q].style.color = "#f5b544"; break;
        }
      }
    }
    bd.scrollTop = bd.scrollTop;
  }).catch(function(e){
    bd.innerHTML = "<p style='color:#ff6b6b'>原文加载失败：" + e.message + "</p><p style='color:#98a1b0'>文件：" + file + "</p>";
  });
}
/* 弹层开关 = 接浏览器返回键(手机上按返回=关弹层, 不是退出页面) */
var modalOn = false;
function hideDoc(){
  document.getElementById("modal").classList.remove("on");
  modalOn = false;
}
function closeDoc(){
  hideDoc();                                        // 立即关闭(不等异步 popstate)
  if(history.state && history.state.__doc){         // 再清掉这次 push 的历史, 免得返回键要按两次
    try { history.back(); } catch(e){}
  }
}
document.getElementById("mback").onclick = closeDoc;
document.getElementById("modal").onclick = function(e){ if(e.target.id === "modal") closeDoc(); };
document.getElementById("sideMask").onclick = closeSide;
window.addEventListener("popstate", function(){
  if(modalOn){ hideDoc(); return; }
  if(document.getElementById("side").classList.contains("on")) closeSide();
});
document.addEventListener("keydown", function(e){
  if(e.key === "Escape" && modalOn) closeDoc();
});

/* ---------- 三层视角 ---------- */
document.getElementById("bD3").onclick = function(){
  var ids = ["A","B","C","D","E","F","G"];
  collapsed = {};
  (function w(n){
    (n.children||[]).forEach(function(c){
      if(ids.indexOf(c.id) >= 0) delete collapsed[c.id];
      else if(c.children && c.children.length) collapsed[c.id] = true;
      w(c);
    });
  })(DATA);
  delete collapsed["A"]; delete collapsed["B"]; delete collapsed["C"];
  render(); fit();
};

/* ---------- 搜索 ---------- */
var q = document.getElementById("q");
q.addEventListener("input", function(){
  var v = q.value.trim().toLowerCase();
  var nodes = document.querySelectorAll(".node");
  if(!v){ nodes.forEach(function(e){ e.classList.remove("dim","hit"); }); return; }
  // 命中自动展开祖先
  var hitIds = {};
  (function w(n, chain){
    (n.children||[]).forEach(function(c){
      var c2 = chain.concat([c]);
      if((c.label + " " + (c.desc||"") + " " + (c.badge||"")).toLowerCase().indexOf(v) >= 0){
        c2.forEach(function(a){ delete collapsed[a.id]; });
        hitIds[c.id] = true;
      }
      w(c, c2);
    });
  })(DATA, []);
  render();
  var idx = {}; layoutNodes.forEach(function(nd, i){ idx[nd.n.id] = i; });
  var all = document.querySelectorAll(".node");
  all.forEach(function(e, i){ e.classList.remove("dim","hit"); });
  layoutNodes.forEach(function(nd, i){
    var e = all[i]; if(!e) return;
    if(hitIds[nd.n.id]) e.classList.add("hit"); else e.classList.add("dim");
  });
});

 '<div style="margin-bottom:6px"><b>图例</b></div>' +
 [['branch','板块'],['stage','阶段'],['doc','方法论'],['sop','SOP'],['method','方法'],['gap','补缺'],['fcard','方法卡'],['dcard','决策卡'],['rule','调度'],['pool','素材']]
 .map(function(x){ return '<div><i style="background:' + (COLORS[x[0]]||"#8e8e93") + '"></i>' + x[1] + '</div>'; }).join("");

/* ---------- 启动 ---------- */
// 默认: 只展开「总根 + 一级板块」，其余收起(保证一屏能看清)；点节点逐层钻取
(function initCollapse(){
  collapsed = {};
  (DATA.children || []).forEach(function(b){
    if(b.children && b.children.length) collapsed[b.id] = true;
  });
})();
render(); fit();
