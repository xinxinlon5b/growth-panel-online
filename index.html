function openCard(t){
  var c = CARDS.find(function(x){ return x.t === t; });
  if(!c) return;
  window.__curCard = c; // 供工具函数(roadmap/eval等)取当前卡, 别再从标题反解
  document.getElementById("mTitle").innerHTML = trustBadge(c) + esc(c.t);
  document.getElementById("mSub").textContent = "位置：" + subName(c.st);
  var body = document.getElementById("mBody"); body.innerHTML = "";
  // 本地进度记忆(按卡标题存, 记录勾选+自评)
  var KEY = "grow_chk_" + c.t;
  var mem = {};
  try{ mem = JSON.parse(localStorage.getItem(KEY) || "{}"); }catch(e){}
  function saveMem(){ try{ localStorage.setItem(KEY, JSON.stringify(mem)); }catch(e){} }

  // —— 是什么(一句话)
  var p = document.createElement("p");
  p.innerHTML = esc(c.what);
  body.appendChild(p);

  // —— 动作区: 工具按钮(优先) + 官方资料链接(次级)
  var act = document.createElement("div");
  act.style.cssText = "margin:10px 0 2px;display:flex;gap:8px;flex-wrap:wrap;align-items:center";
  // 工具按钮: 卡声明了 tool 就渲染对应工具(拿来就能用的入口)
  var TOOLS = {
    "adr": {label: "✍️ 写一条 ADR（填表生成文档）", fn: "adrTool()"},
    "twelve": {label: "📋 12 条逐条自查我的应用", fn: "twelveTool()"},
    "roadmap": {label: "🗺️ 按路线图逐项自评（能学多少一目了然）", fn: "roadmapTool(this)"},
    "usecase": {label: "🧰 这工具我该不该用？怎么上手？", fn: "useTool()"},
    "gate": {label: "🎯 让 Hermes 用这张卡检查我的客户", fn: "gateTool()"},
  };
  if(c.tool && TOOLS[c.tool]){
    var tb = document.createElement("button");
    tb.className = "ask-btn";
    tb.style.cssText = "background:var(--green);padding:7px 14px;font-size:12px";
    tb.textContent = TOOLS[c.tool].label;
    tb.setAttribute("onclick", TOOLS[c.tool].fn);
    act.appendChild(tb);
  }
  if(c.eval && c.eval.groups && c.eval.groups.length){
    var evBtn = document.createElement("button");
    evBtn.className = "ask-btn";
    evBtn.style.cssText = "background:var(--orange);padding:7px 14px;font-size:12px";
    evBtn.textContent = "⚡ 用这张卡检查我的项目";
    evBtn.onclick = function(){ evalCard(c.t); };
    act.appendChild(evBtn);
  }
  if(act.children.length){
    var actWrap = document.createElement("div");
    actWrap.style.margin = "10px 0 2px";
    actWrap.appendChild(act);
    body.appendChild(actWrap);
  }
  // 资料链接(次级, 折叠成一行小字, 不再是大按钮)
  if(c.links && c.links.length){
    var lkBox = document.createElement("div");
    lkBox.style.cssText = "margin:4px 0 2px;font-size:11px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap";
    c.links.forEach(function(lk){
      var a = document.createElement("a");
      a.href = lk.u; a.target = "_blank"; a.rel = "noopener";
      a.style.cssText = "color:#5a7fa0;text-decoration:underline;text-underline-offset:2px";
      a.textContent = "↗ " + lk.n;
      a.title = (lk.d || "");
      lkBox.appendChild(a);
    });
    body.appendChild(lkBox);
  }

  // —— 什么时候需要(只读)
  var whenH = document.createElement("h4"); whenH.textContent = "什么时候需要"; body.appendChild(whenH);
  var whenUl = document.createElement("ul");
  (c.when || "").split(/[；;]/).filter(function(x){return x.trim();}).forEach(function(x){
    var li = document.createElement("li"); li.textContent = x; whenUl.appendChild(li);
  });
  body.appendChild(whenUl);

  // —— 怎么做(可勾选清单: 点一下=这条我做到了)
  var doH = document.createElement("h4"); doH.textContent = "照着做（点一下=我做到了，进度会记住）"; body.appendChild(doH);
  var progBox = document.createElement("div"); progBox.id = "cardProg"; body.appendChild(progBox);
  var doUl = document.createElement("ul"); doUl.className = "chklist";
  (c.how || []).forEach(function(x, i){
    var k = "how" + i;
    var li = document.createElement("li");
    li.className = "chk" + (mem[k] ? " done" : "");
    li.innerHTML = '<span class="box">' + (mem[k] ? "✅" : "☐") + '</span><span class="tx">' + esc(x) + "</span>";
    li.onclick = function(){
      mem[k] = !mem[k]; saveMem();
      li.className = "chk" + (mem[k] ? " done" : "");
      li.querySelector(".box").textContent = mem[k] ? "✅" : "☐";
      renderProg();
    };
    doUl.appendChild(li);
  });
  body.appendChild(doUl);
  // —— 不该怎么做(可勾选: 点一下=我踩过这个坑/提醒自己)
  var badH = document.createElement("h4"); badH.className = "warn"; badH.textContent = "别踩的坑（点一下=我记住了/踩过）"; body.appendChild(badH);
  var badUl = document.createElement("ul"); badUl.className = "chklist";
  (c.bad || []).forEach(function(x, i){
    var k = "bad" + i;
    var li = document.createElement("li");
    li.className = "chk" + (mem[k] ? " done" : "");
    li.innerHTML = '<span class="box">' + (mem[k] ? "⚠️" : "○") + '</span><span class="tx">' + esc(x) + "</span>";
    li.onclick = function(){
      mem[k] = !mem[k]; saveMem();
      li.className = "chk" + (mem[k] ? " done" : "");
      li.querySelector(".box").textContent = mem[k] ? "⚠️" : "○";
    };
    badUl.appendChild(li);
  });
  body.appendChild(badUl);

  function renderProg(){
    var total = (c.how || []).length;
    var n = (c.how || []).filter(function(_, i){ return mem["how" + i]; }).length;
    var label = n === 0 ? "还没开始" : n === total ? "全做到了 🎉" : "上次做到这，继续";
    progBox.innerHTML = '<div style="font-size:11px;color:var(--muted);margin:2px 0 4px">我的进度：' + n + "/" + total + " · " + label + '</div>' +
      '<div style="height:5px;background:var(--line);border-radius:99px;overflow:hidden"><div style="height:100%;width:' + (total ? Math.round(n/total*100) : 0) + '%;background:var(--green);border-radius:99px;transition:.3s"></div></div>';
  }
  renderProg();

  // —— 导出行动清单: 勾完/参考时点一下 → 生成 md 存 Obsidian(这张卡变成可带走/可交付的东西)
  if((c.how || []).length){
    var expBtn = document.createElement("button");
    expBtn.className = "ask-btn";
    expBtn.style.cssText = "width:100%;margin:8px 0 2px;font-size:12px;background:transparent;color:var(--green);border:1.5px solid var(--green)";
    expBtn.textContent = "📝 生成这张卡的「行动清单」存 Obsidian（下次接项目直接翻开用）";
    expBtn.onclick = function(){ exportCardPlan(c); };
    body.appendChild(expBtn);
  }

  // —— 自评: 这张卡对我(记下来, 下次打开知道上次感觉咋样)
  var sq = document.createElement("div");
  sq.style.cssText = "margin-top:18px;padding:14px;border-radius:14px;background:rgba(215,243,107,.12);border:1px solid rgba(215,243,107,.35)";
  var selfKey = "self";
  var labels = {yes:"✅ 我用上了", no:"⏳ 还没用上", huh:"🤔 看不懂"};
  sq.innerHTML = '<div style="font-size:12px;font-weight:700;color:var(--green);margin-bottom:8px">这张卡对我（点一下记一笔，下次打开知道上次感觉咋样）：</div>' +
    '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
    ["yes","no","huh"].map(function(v){
      var on = mem[selfKey] === v;
      return '<button class="selfq' + (on ? " on" : "") + '" data-v="' + v + '">' + labels[v] + (on ? " ✓" : "") + "</button>";
    }).join("") + "</div>" +
    '<div id="selfTs" style="font-size:11px;color:var(--muted);margin-top:6px">' + (mem[selfKey+"_ts"] ? "上次记录：" + mem[selfKey+"_ts"] : "") + "</div>";
  body.appendChild(sq);
  sq.querySelectorAll(".selfq").forEach(function(b){
    b.onclick = function(){
      var v = b.getAttribute("data-v");
      mem[selfKey] = v;
      mem[selfKey + "_ts"] = new Date().toLocaleString("zh-CN", {month:"numeric", day:"numeric", hour:"2-digit", minute:"2-digit"});
      saveMem();
      var tsEl = document.getElementById("selfTs");
      if(tsEl) tsEl.textContent = "上次记录：" + mem[selfKey + "_ts"];
      sq.querySelectorAll(".selfq").forEach(function(x){ x.classList.remove("on"); x.textContent = labels[x.getAttribute("data-v")]; });
      b.classList.add("on"); b.textContent = labels[v] + " ✓";
    };
  });

  // —— 考考我(A): 用卡片的 how/bad 生成选择题, 答错记入错题本
  if(c.how && c.how.length && c.bad && c.bad.length){
    var qz = document.createElement("div");
    qz.className = "quiz-box";
    qz.innerHTML = '<div style="font-size:12px;font-weight:700;color:var(--green);margin-bottom:6px">🎯 考考我（点开题测真会了没——不是考记忆，是考判断）</div>';
    var qzone = document.createElement("div"); qzone.id = "quizZone"; qz.appendChild(qzone);
    body.appendChild(qz);
    var quizK = "grow_quiz_" + c.t;
    var qmem = {}; try{ qmem = JSON.parse(localStorage.getItem(quizK) || "{}"); }catch(e){}
    var answered = qmem.n || 0, correct = qmem.c || 0;
    function wrongSet(){ return qmem.wrong || []; }
    // 生成一题: 题型混合(怎么做正向题 + 反模式判断题), 优先错题
    function pickQuizQ(){
      var wrongIdx = wrongSet();
      // 若上次有错题, 先重考错题
      if(wrongIdx.length){
        var wi = wrongIdx[Math.floor(Math.random() * wrongIdx.length)];
        var pool = wi < (c.bad || []).length ? {type:"bad", i:wi} : {type:"how", i: wi - (c.bad || []).length};
        return pool;
      }
      // 否则随机抽 how 或 bad(正确做法题比反模式题少一些)
      if(Math.random() < 0.45 && (c.how||[]).length > 1){
        return {type:"how", i: Math.floor(Math.random() * c.how.length)};
      }
      return {type:"bad", i: Math.floor(Math.random() * c.bad.length)};
    }
    function buildQuiz(){
      var q = pickQuizQ();
      // 从全局其他卡借干扰项(更真实: 别的卡的正确做法/坑)
      var distractorPool = [];
      CARDS.forEach(function(o){
        if(o.t === c.t) return;
        (o.how||[]).concat(o.bad||[]).forEach(function(x){ if(x && x.length > 4) distractorPool.push(x); });
      });
      // 打乱取 3 干扰项
      var dist = distractorPool.slice().sort(function(){ return Math.random() - .5; }).slice(0, 3);
      var isBad = q.type === "bad";
      var base = isBad ? (c.bad[q.i]) : (c.how[q.i]);
      if(!base){ qzone.innerHTML = '<div class="quiz-fb">这卡没有足够内容出题</div>'; return; }
      var stem = isBad
        ? "哪个是「别踩的坑 / 反模式」？（来自《" + c.t + "》的方法论）"
        : "下面哪条是《" + c.t + "》里「照着做」的正确动作？";
      var options = [base].concat(dist).filter(function(v,i,arr){ return arr.indexOf(v) === i; });
      if(options.length < 2){ qzone.innerHTML = '<div class="quiz-fb">素材不足,先看一遍卡再来考</div>'; return; }
      options.sort(function(){ return Math.random() - .5; });
      var correctIdx = options.indexOf(base);
      var html = '<div class="quiz-q">' + esc(stem) + '</div>';
      options.forEach(function(op, oi){
        html += '<button class="quiz-opt" data-oi="' + oi + '" data-correct="' + (oi === correctIdx) + '">' +
          String.fromCharCode(65 + oi) + '. ' + esc(String(op).slice(0, 90)) + '</button>';
      });
      html += '<div class="quiz-fb" id="quizFb"></div>';
      html += '<div class="quiz-score" id="quizScore"></div>';
      qzone.innerHTML = html;
      var scoreEl = qzone.querySelector("#quizScore");
      scoreEl.innerHTML = "已答 " + answered + " 题 · 对 " + correct + " · 正确率 " + (answered ? Math.round(correct / answered * 100) : 0) + "%";
      qzone.querySelectorAll(".quiz-opt").forEach(function(btn){
        btn.onclick = function(){
          if(btn.classList.contains("locked")) return;
          var isCorrect = btn.getAttribute("data-correct") === "true";
          var fb = qzone.querySelector("#quizFb");
          // 记答案(错题进错题本)
          if(isCorrect) correct++;
          else {
            var ws = wrongSet();
            var qIdx = (q.type === "bad" ? q.i : q.i + (c.bad||[]).length);
            if(ws.indexOf(qIdx) < 0) ws.push(qIdx);
            qmem.wrong = ws;
          }
          answered++;
          qmem.n = answered; qmem.c = correct;
          try{ localStorage.setItem(quizK, JSON.stringify(qmem)); }catch(e){}
          // 标色
          qzone.querySelectorAll(".quiz-opt").forEach(function(o){
            if(o.getAttribute("data-correct") === "true") o.classList.add("correct");
            else o.classList.add("locked");
            if(o === btn && !isCorrect) btn.classList.add("wrong");
          });
          fb.innerHTML = isCorrect
            ? "✅ 对！<b>" + esc(String(base).slice(0, 120)) + "</b>"
            : "❌ 记一下（已进错题本，下次优先考你）：<b>" + esc(String(base).slice(0, 120)) + "</b>";
          scoreEl.innerHTML = "已答 " + answered + " 题 · 对 " + correct + " · 正确率 " + Math.round(correct / answered * 100) + "% · <a style='cursor:pointer;color:var(--green);text-decoration:underline' onclick='window.__nextQuiz && window.__nextQuiz()'>下一题 →</a>";
        };
      });
      window.__nextQuiz = function(){ buildQuiz(); };
    }
    buildQuiz();
  }

  // —— 学习资料
  var lh = document.createElement("h4"); lh.textContent = "📚 学习资料（点开可看/可学）"; body.appendChild(lh);
  var links = document.createElement("div"); links.className = "links";
  (c.links || []).forEach(function(lk){
    var a = document.createElement("a");
    a.className = "link-row"; a.href = lk.u; a.target = "_blank"; a.rel = "noopener";
    a.innerHTML = '<span class="star">学习</span><div><div class="ln">' + esc(lk.n) + '</div><div class="ld">' + esc(lk.d) + "</div></div><span class='go'>↗</span>";
    links.appendChild(a);
  });
  if(!c.links || !c.links.length){ links.innerHTML = '<div class="link-row"><div class="ln">暂无链接，后续补充</div></div>'; }
  body.appendChild(links);
  document.getElementById("mask").classList.add("show");
}
/* ---- ⚡ 用卡检查我的项目: 逐题三态评估 → 差距报告 → 可存 Obsidian ---- */
var _evalAnswers = {};
function evalCard(t){
  var c = CARDS.find(function(x){ return x.t === t; });
  if(!c || !c.eval || !c.eval.groups){ toast("这张卡还没配检查题"); return; }
  document.getElementById("mTitle").textContent = "⚡ " + c.t + " · 检查我的项目";
  document.getElementById("mSub").textContent = "逐题诚实回答（✅做到了 / ⚠️部分 / ❌没有）→ 给你差距报告和行动建议";
  var b = document.getElementById("mBody"); b.innerHTML = "";
  _evalAnswers = {};
  var h = '<div style="font-size:12px;color:var(--muted);margin-bottom:10px">检查对象是哪个项目/系统？（可选，写下来报告会带上）</div>';
  h += '<input id="evalTarget" style="width:100%;padding:8px 12px;border:1.5px solid #d8d2c0;border-radius:10px;font-size:13px;margin-bottom:12px" placeholder="例：阿尔泰物流系统 / 还没做的新项目规划 / 我的通用做法">';
  var gi = 0, ii = 0;
  c.eval.groups.forEach(function(g, gidx){
    h += '<div style="margin:8px 0 4px;font-weight:800;font-size:13px;color:var(--green)">' + esc(g.name) + '</div>';
    g.items.forEach(function(it){
      var qid = "e" + gidx + "_" + ii;
      h += '<div style="margin:6px 0;padding:10px 12px;border:1px solid #e5e0d2;border-radius:12px;background:#fffdf8">' +
        '<div style="font-size:13px;margin-bottom:6px">' + esc(it.q) + '</div>' +
        '<div style="display:flex;gap:6px;flex-wrap:wrap">' +
        '<button type="button" class="eval-btn y" data-q="' + qid + '" onclick="evalPick(this,\'y\')">✅ 做到了</button>' +
        '<button type="button" class="eval-btn m" data-q="' + qid + '" onclick="evalPick(this,\'m\')">⚠️ 部分/不确定</button>' +
        '<button type="button" class="eval-btn n" data-q="' + qid + '" onclick="evalPick(this,\'n\')">❌ 没有</button></div></div>';
      ii++;
    });
  });
  h += '<button class="ask-btn" style="width:100%;margin-top:10px" onclick="evalReport(\'' + t.replace(/'/g,"\\'") + '\')">📊 生成差距报告</button>';
  b.innerHTML = h;
  document.getElementById("mask").classList.add("show");
}
function evalPick(btn, v){
  _evalAnswers[btn.getAttribute("data-q")] = v;
  var wrap = btn.parentElement;
  wrap.querySelectorAll(".eval-btn").forEach(function(x){ x.classList.remove("on"); });
  btn.classList.add("on");
}
function evalReport(t){
  var c = CARDS.find(function(x){ return x.t === t; });
  if(!c) return;
  var target = (document.getElementById("evalTarget") ? document.getElementById("evalTarget").value : "").trim();
  window._evalTargetTxt = target || "（未填）";
  var groups = c.eval.groups;
  var gi = 0, ii = 0, okN = 0, halfN = 0, noN = 0, noList = [];
  var groupRes = [];
  groups.forEach(function(g, gidx){
    var gOk = 0, gTotal = g.items.length;
    var gNo = [];
    g.items.forEach(function(it){
      var qid = "e" + gidx + "_" + ii;
      var v = _evalAnswers[qid] || "";
      if(v === "y"){ okN++; gOk++; }
      else if(v === "m"){ halfN++; }
      else if(v === "n"){ noN++; gNo.push({it:it}); }
      else { gNo.push({it:it, unanswered:true}); }
      ii++;
    });
    groupRes.push({name:g.name, ok:gOk, total:gTotal, no:gNo});
  });
  var total = okN + halfN + noN;
  var score = total ? Math.round((okN + halfN * 0.5) / total * 100) : 0;
  // —— 渲染报告
  var b = document.getElementById("mBody");
  var h = '<div style="margin-bottom:6px"><b style="font-size:15px">📊 ' + esc(c.t) + ' 差距报告</b>' +
    (target ? '<div style="font-size:12px;color:var(--muted)">对象：' + esc(target) + '</div>' : "") + '</div>';
  h += '<div style="display:flex;gap:10px;align-items:center;margin:8px 0">' +
    '<div style="font-size:34px;font-weight:900;color:' + (score >= 80 ? "var(--green)" : score >= 50 ? "var(--orange)" : "#c0392b") + '">' + score + '</div>' +
    '<div style="font-size:12px;color:var(--muted);line-height:1.6">✅ 做到 ' + okN + ' · ⚠️ 部分 ' + halfN + ' · ❌ 没有 ' + noN + '<br>' +
    (score >= 80 ? "整体不错，补剩下缺口就稳了" : score >= 50 ? "及格边缘——把 ❌ 的补上再谈优化" : "还有不少硬伤，按下面优先级逐个补") + '</div></div>';
  var groupHtml = "";
  var hasGaps = false;
  groupRes.forEach(function(g){
    var pct = g.total ? Math.round(g.ok / g.total * 100) : 100;
    groupHtml += '<div style="margin:6px 0;padding:8px 12px;border-radius:10px;background:#fafcf7;border:1px solid #e5ecdc">' +
      '<div style="font-size:12px;font-weight:700;display:flex;justify-content:space-between">' + esc(g.name) + '<span style="color:' + (pct === 100 ? "var(--green)" : pct >= 50 ? "var(--orange)" : "#c0392b") + '">' + g.ok + "/" + g.total + "</span></div>";
    if(g.no.length){
      hasGaps = true;
      g.no.forEach(function(x){
        groupHtml += '<div style="font-size:11.5px;color:#7a5b1e;background:#fff7e8;border-radius:8px;padding:6px 10px;margin:4px 0">' +
          (x.unanswered ? "（未答）" : "❌ ") + esc(x.it.q) + '<br><span style="color:var(--green)">→ 改法：' + esc(x.it.fix || x.it.good || "") + '</span></div>';
      });
    } else if(g.ok < g.total){
      groupHtml += '<div style="font-size:11px;color:var(--orange)">⚠️ 部分做到（有 ⚠️ 半答项），建议补到全绿</div>';
    } else {
      groupHtml += '<div style="font-size:11px;color:var(--green)">✅ 这组没问题</div>';
    }
    groupHtml += "</div>";
  });
  h += groupHtml;
  if(!hasGaps){ h += '<div style="margin:8px 0;padding:10px;border-radius:10px;background:#e8f5e9;color:#2e7d32;font-size:13px">🎉 全绿——保持，定期复查即可</div>'; }
  h += '<div style="display:flex;gap:8px;margin-top:12px">' +
    '<button class="ask-btn" style="flex:1" onclick="evalSave(\'' + t.replace(/'/g,"\\'") + '\',' + score + ')">💾 存报告到 Obsidian</button>' +
    '<button class="ask-btn" style="background:transparent;color:var(--ink);border:1px solid #ccc;flex:1" onclick="closeM()">完成</button></div>';
  h += '<div style="margin-top:8px;font-size:11px;color:var(--muted)">存了以后复盘/下次接单可查：这个系统在' + esc(c.t) + '上还有哪些没做到。</div>';
  b.innerHTML = h;
}
function evalSave(t, score){
  var c = CARDS.find(function(x){ return x.t === t; });
  if(!c) return;

      if(v == "y") y++; else if(v == "m") m++; else if(v == "n"){ n++; notYet.push(ph.name.slice(0, 6) + " · " + it.n); }

    gidx++;
  });
  var answered = y + m + n;
  if(answered < total){ toast("还有 " + (total - answered) + " 项没勾，勾完才准"); return; }
  var score = Math.round((y + m * 0.5) / total * 100);
  var b = document.getElementById("mBody");
  b.innerHTML =
    '<div style="font-size:22px;font-weight:800;text-align:center;color:var(--ink);margin:6px 0">' + score + ' 分</div>' +
    '<div style="text-align:center;font-size:13px;margin-bottom:10px">' + (score >= 75 ? "🏆 路线覆盖度不错" : score >= 45 ? "👍 走了一半，继续" : "⚠️ 刚起步，从❌的开始学") + '（' + esc(target) + '）</div>' +
    '<div style="display:flex;gap:6px;margin-bottom:12px">' +
      '<div style="flex:1;text-align:center;background:#d9f2e3;border-radius:10px;padding:8px"><div style="font-size:18px;font-weight:800">' + y + '</div><div style="font-size:10px">✅ 会</div></div>' +
      '<div style="flex:1;text-align:center;background:#fff3d6;border-radius:10px;padding:8px"><div style="font-size:18px;font-weight:800">' + m + '</div><div style="font-size:10px">⚠️ 会一点</div></div>' +
      '<div style="flex:1;text-align:center;background:#fde2dd;border-radius:10px;padding:8px"><div style="font-size:18px;font-weight:800">' + n + '</div><div style="font-size:10px">❌ 不会</div></div>' +
    '</div>' +
    (notYet.length ? '<div style="font-size:12px;font-weight:700;color:#c0392b;margin-bottom:4px">🔴 下一步该学的：</div><div style="font-size:12px;margin-bottom:10px">' + notYet.map(function(x){ return "<div>· " + x + "</div>"; }).join("") + '</div>' : '<div style="font-size:12px;color:#2e9e6b;margin-bottom:10px">🎉 全覆盖了，去教别人或做更难的项目</div>') +
    '<div style="display:flex;gap:8px"><button class="ask-btn" style="flex:1" onclick="roadmapSave()">💾 存 Obsidian 留档</button>' +
    '<button class="ask-btn" style="background:transparent;color:var(--ink);border:1px solid #ccc;flex:1" onclick="roadmapTool(null)">↩ 回去改</button></div>';
  window.__rmData = {title: rm.title, target: target, score: score, y: y, m: m, n: n};
}
function roadmapSave(){
  var d = window.__rmData || {};
  var md = "# " + d.title + " · " + d.target + "\n\n- **得分**: " + d.score + "/100（✅" + d.y + " ⚠️" + d.m + " ❌" + d.n + "）\n- **日期**: " + new Date().toLocaleString("zh-CN") + "\n";
  fetch("/api/save_doc", {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({title: (d.title || "路线图").slice(0, 20) + "-" + (d.target || "自评"), content: md, folder: "评估报告"})})
    .then(r => r.json())
    .then(dd => { if(dd.ok){ toast("✅ 已存：" + dd.file); closeM(); } else { toast("✗ " + (dd.error || "保存失败")); } })
    .catch(function(e){ toast("✗ 网络错误:" + e); });
}
/* ---- 📝 导出卡行动清单: 把方法卡的 how/bad 变成可交付 md 存 Obsidian ---- */
function exportCardPlan(c){
  if(!c) c = window.__curCard;
  if(!c) return;
  var KEY = "grow_chk_" + c.t;
  var mem = {};
  try{ mem = JSON.parse(localStorage.getItem(KEY) || "{}"); }catch(e){}
  var lines = ["# 行动清单 · " + c.t, "", "> 来源卡：" + (c.what || ""), "", "## 什么时候用", "", c.when || "（无）", "", "## 照着做（勾了 = 已做到）", ""];
  (c.how || []).forEach(function(x, i){ lines.push("- [" + (mem["how" + i] ? "x" : " ") + "] " + x); });
  lines.push("", "## 别踩的坑", "");
  (c.bad || []).forEach(function(x, i){ lines.push("- [" + (mem["bad" + i] ? "x" : " ") + "] " + x); });
  var md = lines.join("\n");
  fetch("/api/save_doc", {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({title: "行动清单-" + c.t, content: md, folder: "评估报告"})})
    .then(r => r.json())
    .then(d => { if(d.ok){ toast("✅ 行动清单已存 Obsidian：" + d.file); } else { toast("✗ " + (d.error || "保存失败")); } })
    .catch(function(e){ toast("✗ 网络错误:" + e); });
}
/* ---- 🧰 工具决策速查: 打开卡 = 知道该不该用/怎么上手, 不跳 GitHub ---- */
function useTool(){
  var c = window.__curCard;
  var u = c && c.use;
  if(!u){ toast("这张卡没有「怎么用」数据"); return; }
  document.getElementById("mTitle").textContent = "🧰 " + c.t;
  document.getElementById("mSub").textContent = "别急着跳 GitHub——先看它解决你什么问题、该不该用、第一步干嘛";
  var b = document.getElementById("mBody");
  var h = "";
  h += '<div style="font-size:13px;font-weight:700;color:var(--ink);margin-bottom:6px">这个工具解决什么问题</div>';
  h += '<div style="font-size:12px;color:#444;margin-bottom:12px">' + esc(c.what) + '</div>';
  h += '<div style="font-size:12px;font-weight:700;color:var(--green);margin-bottom:6px">✅ 它的好处（为什么值得用）</div>';
  h += '<ul style="margin:0 0 12px 18px;font-size:12px">' + u.pros.map(function(x){ return "<li>" + esc(x) + "</li>"; }).join("") + '</ul>';
  h += '<div style="font-size:12px;font-weight:700;color:#c0392b;margin-bottom:6px">⚠️ 它的代价（用了要认什么）</div>';
  h += '<ul style="margin:0 0 12px 18px;font-size:12px">' + u.cons.map(function(x){ return "<li>" + esc(x) + "</li>"; }).join("") + '</ul>';
  h += '<div style="font-size:12px;font-weight:700;color:#245a80;margin-bottom:4px">🔵 什么时候该用它</div>';
  h += '<div style="font-size:12px;background:#eef5fb;padding:8px 10px;border-radius:8px;margin-bottom:10px">' + esc(u.when_use) + '</div>';
  h += '<div style="font-size:12px;font-weight:700;color:#7a5b1e;margin-bottom:4px">🟠 什么时候别用（用别的最划算）</div>';
  h += '<div style="font-size:12px;background:#fff7e8;padding:8px 10px;border-radius:8px;margin-bottom:12px">' + esc(u.when_not) + '</div>';
  h += '<div style="font-size:12px;font-weight:700;color:var(--ink);margin-bottom:4px">🚀 上手第一步（现在就做）</div>';
  h += '<div style="font-size:12px;background:#f0faf4;padding:8px 10px;border-radius:8px;margin-bottom:12px;line-height:1.7">' + esc(u.first_step) + '</div>';
  h += '<div style="display:flex;gap:8px"><button class="ask-btn" style="flex:1" onclick="usePlanSave()">📌 把这工具记进我的待办</button>' +
       '<button class="ask-btn" style="background:transparent;color:var(--ink);border:1px solid #ccc;flex:1" onclick="closeM()">知道了</button></div>';
  b.innerHTML = h;
  window.__useCard = c;
  document.getElementById("mask").classList.add("show");
}
function usePlanSave(){
  var c = window.__useCard || window.__curCard;
  if(!c) return;
  var u = c.use || {};
  var md = "# 待评估工具 · " + c.t + "\n\n> " + (c.what || "") + "\n\n## 什么时候用它\n" + (u.when_use || "") + "\n\n## 别用它的场景\n" + (u.when_not || "") + "\n\n## 上手第一步\n" + (u.first_step || "") + "\n";
  fetch("/api/save_doc", {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({title: "工具待办-" + c.t, content: md, folder: "评估报告"})})
    .then(r => r.json())
    .then(d => { if(d.ok){ toast("✅ 已记进 Obsidian：" + d.file); closeM(); } else { toast("✗ " + (d.error || "保存失败")); } })
    .catch(function(e){ toast("✗ 网络错误:" + e); });
}
function closeM(){ document.getElementById("mask").classList.remove("show"); }
document.getElementById("mask").onclick = function(e){ if(e.target === this) closeM(); };

/* ---- 收录新内容（写候选池）---- */
function openCollect(){
  var m = document.getElementById("collectMask");
  if(!m){ buildCollect(); m = document.getElementById("collectMask"); }
  m.style.display = "flex";
}
function buildCollect(){
  var html = '<div class="collect-mask" id="collectMask" onclick="if(event.target===this)this.style.display=\'none\'">' +
    '<div class="collect-box">' +
    '<div class="collect-head"><h3>＋ 收录一条新内容</h3><button class="x" onclick="document.getElementById(\'collectMask\').style.display=\'none\'">✕</button></div>' +
    '<p class="collect-hint">填好点「提交」，自动写入候选池（Obsidian）待三审后入库。这是真实落库，不是临时的。</p>' +
    '<label>标题 *<input id="cT" placeholder="这条内容叫什么，如：给短视频带货做获客"></label>' +
    '<label>分类选择<select id="cS">' +
    '<option value="f">① 框架做对</option><option value="c">② 学别人的经验</option>' +
    '<option value="r">③ 我们的实战复盘</option><option value="a">④ 审核标准</option></select></label>' +
    '<label>是什么（一句话）<textarea id="cW" rows="2"></textarea></label>' +
    '<label>什么时候需要<textarea id="cH" rows="2"></textarea></label>' +
    '<label>怎么做 / 关键点<textarea id="cRed" rows="2"></textarea></label>' +
    '<label>不该怎么做 / 反模式<textarea id="cBad" rows="2"></textarea></label>' +
    '<label>来源（链接/出处）<input id="cSrc" placeholder="抖音链接 / GitHub / 项目名"></label>' +
    '<div class="collect-actions"><button class="ok" onclick="submitCollect()">提交入候选池</button>' +
    '<button class="cancel" onclick="document.getElementById(\'collectMask\').style.display=\'none\'">取消</button></div>' +
    '<div id="collectMsg" class="collect-msg"></div></div></div>';
  document.body.insertAdjacentHTML("beforeend", html);
}
function submitCollect(){
  var st = document.getElementById("cS").value;
  var t = document.getElementById("cT").value.trim();
  var what = document.getElementById("cW").value.trim();
  var when = document.getElementById("cH").value.trim();
  var how = document.getElementById("cRed").value.trim();
  var bad = document.getElementById("cBad").value.trim();
  var src = document.getElementById("cSrc").value.trim();
  if(!t){ document.getElementById("collectMsg").textContent = "请填标题"; return; }
  document.getElementById("collectMsg").textContent = "提交中…";
  fetch("/api/collect", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({st:st, t:t, what:what, when:when, how:how, bad:bad, src:src})})
    .then(function(r){return r.json();})
    .then(function(d){
      if(d.ok){
        document.getElementById("collectMsg").innerHTML = "✅ 已写入候选池：" + d.file + "（候选池现有 " + d.candidate_pool + " 条）";
        [["cT",""],["cW",""],["cH",""],["cRed",""],["cBad",""],["cSrc",""]].forEach(function(p){ var el=document.getElementById(p[0]); if(el) el.value=""; });
        loadStatus();
      } else { document.getElementById("collectMsg").textContent = "✗ " + (d.error||"失败"); }
    })
    .catch(function(e){ document.getElementById("collectMsg").textContent = "✗ 网络错误:" + e; });
}

function auditCand(file, action){
  if(!confirm("确认" + (action === "approve" ? "通过" : "驳回") + "这条候选？")) return;
  fetch("/api/audit", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({action:action, file:file})})
    .then(function(r){return r.json();})
    .then(function(d){
      if(d.ok){
        toast(action === "approve" ? "✅ 已通过，移动到审核报告区" : "已驳回删除");
        loadStatus();
      } else { toast("✗ " + (d.error||"操作失败")); }
    })
    .catch(function(e){ toast("✗ 网络错误:" + e); });
}
