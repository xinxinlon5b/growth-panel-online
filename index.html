<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>成长系统 · 工作台 v2.1</title>
<style>
:root{
  --ink:#17231f; --muted:#65736e; --paper:#f4f2eb; --card:#fffdf8;
  --line:#dcded7; --green:#145c42; --lime:#d7f36b; --orange:#e86d45;
  --shadow:0 24px 60px rgba(25,45,37,.09);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.shell{min-height:100vh;display:grid;grid-template-columns:250px 1fr}
/* 侧边栏 */
.sidebar{position:sticky;top:0;height:100vh;padding:32px 18px;background:#163c31;color:#fff;display:flex;flex-direction:column;overflow-y:auto}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:#fff}
.brand-mark{width:42px;height:42px;display:grid;place-items:center;border-radius:13px;background:var(--lime);color:#173a30;font-weight:900;font-size:18px}
.brand strong{display:block;font-size:16px}
.brand small{display:block;margin-top:2px;color:#abc0b9;font-size:9px;letter-spacing:.08em;text-transform:uppercase}
nav{display:grid;gap:4px;margin-top:30px}
.nav-item{width:100%;padding:8px 10px;margin:1px 0;border:0;border-radius:12px;background:transparent;color:#b8cac4;text-align:left;display:grid;grid-template-columns:30px 1fr;gap:0 10px;align-items:center;cursor:pointer;transition:background .15s}
.nav-item .ic{grid-row:1/3;display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.1);font-size:14px;line-height:1}
.nav-item .ni{font-size:12.5px;font-weight:700;color:#eef7f2;line-height:1.25;align-self:end}
.nav-item .nd{font-size:9.5px;opacity:.6;line-height:1.3;color:#b8cac4;align-self:start}
.nav-item:hover{background:rgba(255,255,255,.07)}
.nav-item:hover .ic{background:rgba(255,255,255,.16)}
.nav-item.active{background:rgba(215,243,107,.16)}
.nav-item.active .ic{background:var(--lime);box-shadow:0 2px 8px rgba(215,243,107,.35)}
.nav-item.active .ni{color:var(--lime)}
.nav-item.active .nd{color:#cfe3d9;opacity:.9}
.nav-item.home{background:rgba(215,243,107,.08)}
.nav-item.home .ni{color:#d8f2a8}
.nav-item.home.active{background:rgba(215,243,107,.16)}
.nav-item.home.active .ic{background:var(--lime)}
.nav-item.home.active .ni{color:var(--lime)}
.side-note{margin-top:auto;padding:14px;border:1px solid rgba(255,255,255,.13);border-radius:14px;background:rgba(0,0,0,.08);color:#abc0b9;font-size:10px;line-height:1.6}
.side-note b{color:var(--lime)}
/* 主区 */
main{width:min(1180px,calc(100vw - 250px));margin:0 auto;padding:30px 44px 40px}
.topbar{display:flex;align-items:baseline;justify-content:space-between;padding-bottom:18px;border-bottom:1px solid var(--line)}
.eyebrow{color:var(--green);font-weight:800;font-size:10px;letter-spacing:.16em;text-transform:uppercase}
.topbar h1{margin:6px 0 0;font-size:22px;font-weight:750}
.crumb{color:var(--muted);font-size:11px;margin-top:6px}
.crumb a{color:var(--green);cursor:pointer;text-decoration:none}
.crumb a:hover{text-decoration:underline}
/* 工作台 */
.hero{padding:6px 0 2px}
.hero h2{font-size:clamp(20px,2.6vw,28px);letter-spacing:-.02em;margin-bottom:4px;font-weight:800}
.hero h2 i{color:var(--green);font-style:normal}
.hero p{color:var(--muted);font-size:12px;line-height:1.6;max-width:720px;margin:0}
/* 首页上区: 搜索直接进 hero 下方, 不再单独巨块 */
.home-quick{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:16px 0 4px;align-items:start}
.home-quick .side{border:1px solid var(--line);border-radius:16px;background:var(--card);padding:14px 16px}
.home-quick .sec-title{font-size:12px;font-weight:800;color:var(--ink);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.search-row{display:flex;gap:10px;margin:22px 0 8px;flex-wrap:wrap}
.search-box{flex:1;min-width:280px;position:relative}
.search-box input{width:100%;padding:15px 44px 15px 18px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);font-size:14px;color:var(--ink);outline:none;transition:.2s;font:inherit}
.search-box input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(20,92,66,.12)}
.search-box .ico{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:16px}
.ask-btn{padding:15px 20px;border:0;border-radius:14px;background:var(--green);color:#fff;font-weight:750;cursor:pointer;font-size:13px;transition:.2s}
.ask-btn:hover{background:#1a6e50}
.tier-btn{padding:8px 14px;border-radius:10px;border:1.5px solid #d8d2c0;background:#fff;font-size:12px;cursor:pointer;font:inherit;color:var(--ink);transition:.15s}
.tier-btn.on{border-color:var(--green);background:#e8f3e6;color:#1d5c3e;font-weight:700}
.chip-btn{padding:6px 12px;border-radius:999px;border:1px solid #dceade;background:#f4f9f4;font-size:11px;cursor:pointer;font:inherit;color:#3a5544;transition:.15s}
.chip-btn:hover{border-color:#9db86a;background:#eaf3e4}
.gap-item{border:1px solid #d8e2cf;border-radius:12px;padding:8px 10px;margin:6px 0;background:#fafcf7;display:flex;align-items:center;gap:8px}
.gap-item .g-t{flex:1;font-size:12px;color:var(--ink)}
.gap-item .g-src{font-size:10px;color:var(--muted)}
.gap-act{padding:4px 10px;border-radius:8px;border:0;font-size:11px;cursor:pointer;font:inherit;font-weight:600}
.gap-act.lk{background:#eef3e8;color:#2d6a4f;border:1px solid #cfe0c2}
.gap-act.learn{background:#fff3e0;color:#9a6a1a;border:1px solid #efd9ae}
.gap-act.done{background:#e8f5e9;color:#2e7d32;border:1px solid #c8e6c9}
.gap-act.rm{background:#fdf0ef;color:#b03a2e;border:1px solid #f3d0cd}
/* 用卡检查项目: 三态答题 */
.eval-btn{padding:5px 12px;border-radius:8px;border:1px solid #ddd6c6;background:#fff;font-size:11.5px;cursor:pointer;font:inherit;color:#555;transition:.15s}
.eval-btn.y:hover,.eval-btn.y.on{border-color:#2d6a4f;background:#e8f3e6;color:#2d6a4f}
.eval-btn.m:hover,.eval-btn.m.on{border-color:#b7791f;background:#fdf3e0;color:#9a6a1a}
.eval-btn.n:hover,.eval-btn.n.on{border-color:#c0392b;background:#fdecea;color:#b03a2e}
/* 状态栏(右栏半宽内) */
.status-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:0 0 6px}
.stat-card{padding:8px 4px;border:1px solid var(--line);border-radius:12px;background:var(--card);text-align:center}
.stat-card .num{font-size:16px;font-weight:800;color:var(--green);line-height:1.2}
.stat-card .lbl{font-size:9px;color:var(--muted);margin-top:3px;line-height:1.3}
.stat-card.warn .num{color:var(--orange)}
/* 主目录 */
.dir-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}
.dir-card{padding:16px 18px;border:1px solid var(--line);border-radius:18px;background:var(--card);box-shadow:var(--shadow);cursor:pointer;transition:.18s}
.dir-card:hover{transform:translateY(-2px);box-shadow:0 16px 40px rgba(25,45,37,.12)}
.dir-card .ico{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:var(--green);color:var(--lime);font-size:15px;font-weight:900;margin-bottom:8px}
.dir-card h2{font-size:15px;margin-bottom:3px}
.dir-card p{color:var(--muted);font-size:11.5px;line-height:1.55;margin-bottom:6px}
.dir-card .stat{margin-top:6px;display:inline-block;padding:3px 8px;border-radius:999px;background:#edf3e8;color:#385048;font-size:10px;font-weight:800}
/* 候选池待审(独立通栏) */
#candBox{margin-top:14px;border:1px solid #ecd9b0;border-radius:16px;background:#fffaf0;padding:12px 16px}
#candBox .cand-head{font-size:12.5px;font-weight:800;color:#80522b;margin-bottom:8px}
#candBox .cand-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-top:1px dashed #eeddc0}
#candBox .cand-row:first-of-type{border-top:0}
#candBox .cand-fn{flex:1;font-size:12px;color:#3d3526;word-break:break-all}
/* 搜索/问结果 */
.results{margin-top:16px}
.results .rcount{color:var(--muted);font-size:12px;margin-bottom:12px}
.res-group{margin-bottom:16px}
.res-group h4{font-size:12px;color:var(--green);margin-bottom:8px;font-weight:800}
.res-item{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:14px 16px;margin-bottom:8px;cursor:pointer;transition:.15s}
.res-item:hover{border-color:var(--green);box-shadow:var(--shadow)}
.res-item h5{font-size:14px;margin-bottom:4px}
.res-item .w{font-size:11px;color:var(--muted);line-height:1.6}
.res-item .loc{font-size:10px;color:var(--green);margin-top:6px;font-weight:750}
mark{background:var(--lime);color:#18392f;border-radius:3px;padding:0 2px}
/* 子目录 */
.subs{display:grid;gap:10px;margin-top:22px}
.sub-row{border:1px solid var(--line);border-radius:16px;background:var(--card);padding:16px 18px;cursor:pointer;display:grid;grid-template-columns:44px 1fr auto auto;align-items:center;gap:14px;transition:.16s}
.sub-row:hover{border-color:#b8c9bb;transform:translateX(3px)}
.sub-row .idx{width:36px;height:36px;border-radius:11px;background:#edf3e8;color:var(--green);display:grid;place-items:center;font-weight:850;font-size:14px}
.sub-row .st{font-size:15px;font-weight:750}
.sub-row .sd{font-size:11px;color:var(--muted);margin-top:3px}
.sub-row .cnt{font-size:10px;color:var(--green);background:#edf3e8;border-radius:999px;padding:4px 9px;font-weight:800}
.sub-row .arr{color:#abc0b9;font-size:18px}
/* 功能点 */
.funcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-top:22px}
.func{border:1px solid var(--line);border-radius:16px;background:var(--card);padding:18px 20px;cursor:pointer;transition:.16s}
.func:hover{border-color:var(--green);box-shadow:var(--shadow)}
.trust{display:inline-block;font-size:10px;font-weight:700;border-radius:99px;padding:1px 8px;margin-right:6px;vertical-align:1px;letter-spacing:.3px}
.trust-real{background:rgba(107,143,36,.14);color:#4f6b16;border:1px solid rgba(107,143,36,.4)}
.trust-research{background:rgba(38,99,158,.13);color:#23598e;border:1px solid rgba(38,99,158,.38)}
.trust-method{background:rgba(216,158,38,.13);color:#96680c;border:1px solid rgba(216,158,38,.38)}
.trust-frame{background:rgba(109,84,181,.13);color:#5d46a0;border:1px solid rgba(109,84,181,.38)}
/* 徽章: h3 内嵌 */
.func h3 .trust{vertical-align:2px}
/* 考考我(A) */
.quiz-box{margin-top:16px;padding:14px;border-radius:14px;background:#f4f9f4;border:1px solid #dceade}
.quiz-q{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:8px;line-height:1.6}
.quiz-opt{display:block;width:100%;text-align:left;margin:5px 0;padding:8px 12px;border-radius:10px;border:1px solid #dceade;background:#fff;font-size:13px;color:var(--ink);cursor:pointer;line-height:1.5;transition:.15s}
.quiz-opt:hover{border-color:var(--green)}
.quiz-opt.correct{background:rgba(107,143,36,.16);border-color:var(--green);font-weight:600}
.quiz-opt.wrong{background:rgba(222,90,66,.14);border-color:#de5a42}
.quiz-fb{font-size:12px;color:var(--muted);margin:8px 0 4px;min-height:18px}
.quiz-score{margin-top:10px;padding:10px;border-radius:10px;font-size:13px;background:rgba(215,243,107,.18);text-align:center;font-weight:700;color:#18392f}
/* 待复习(B) + 学习统计(E) */
.review-strip{margin:10px 0 6px;padding:12px 16px;border-radius:14px;background:rgba(216,158,38,.1);border:1px solid rgba(216,158,38,.35)}
.review-strip .rv{font-size:13px;margin:3px 0;cursor:pointer;color:var(--ink)}
.review-strip .rv:hover{color:var(--green)}
.stats-mine{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stats-mine .sm{padding:6px 4px;border-radius:10px;background:#f2f6ec;border:1px solid #e5ecdc;text-align:center}
.stats-mine .sm .num{font-size:16px;font-weight:800;color:var(--green);line-height:1.1}
.stats-mine .sm .lbl{font-size:9px;color:var(--muted);margin-top:2px;line-height:1.35}
/* 关卡地图可视化(C) */
.map-stage{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid #d8d2c0;background:#fffdf8;cursor:pointer;font:inherit;transition:.15s;color:var(--ink)}
.map-stage:hover{border-color:var(--green);transform:translateY(-1px)}
.map-stage.on{background:var(--lime);border-color:#8aa24a;box-shadow:0 2px 8px rgba(138,162,74,.3)}
.map-stage .ms-n{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.08);font-size:11px;font-weight:800}
.map-stage.on .ms-n{background:rgba(0,0,0,.15)}
.map-stage .ms-icon{font-size:14px}
.map-stage .ms-name{font-size:12px;font-weight:650}
.map-gate{border:1px solid #e8e2d4;border-radius:14px;background:#fffdf8;padding:12px 14px;cursor:pointer;transition:.16s;position:relative}
.map-gate:hover{border-color:var(--green);box-shadow:0 2px 10px rgba(0,0,0,.06)}
.map-gate.done{border-color:var(--green);background:rgba(215,243,107,.1)}
.map-gate .mg-top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.map-gate .mg-id{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:22px;padding:0 6px;border-radius:8px;background:var(--lime);color:#18392f;font-size:11px;font-weight:800}
.map-gate .mg-key{font-size:12px;line-height:1.6;color:#4a5a54;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.map-gate.done .mg-key{-webkit-line-clamp:6}
.map-gate .mg-cards{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.map-gate .mg-card{display:inline-block;font-size:10.5px;padding:2px 8px;border-radius:99px;background:rgba(38,99,158,.1);color:#23598e;border:1px solid rgba(38,99,158,.25);cursor:pointer}
.map-gate .mg-card:hover{background:rgba(38,99,158,.2)}
.func .when{font-size:11px;color:var(--muted);line-height:1.65;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.func .ent{font-size:11px;color:var(--green);margin-top:10px;font-weight:750}
/* 场景向导 */
.scen-tpl{display:grid;gap:12px;margin-top:18px}
.scen-tpl-card{border:1px solid var(--line);border-radius:16px;background:var(--card);padding:18px 20px;cursor:pointer;transition:.16s}
.scen-tpl-card:hover{border-color:var(--green);box-shadow:var(--shadow)}
.scen-tpl-card h3{font-size:15px;margin-bottom:4px}
.scen-tpl-card p{font-size:11px;color:var(--muted);line-height:1.6;margin-bottom:8px}
.scen-tpl-card .chips{display:flex;flex-wrap:wrap;gap:6px}
.scen-tpl-card .chip{font-size:10px;background:#edf3e8;color:#385048;border-radius:999px;padding:3px 9px;font-weight:750}
.scen-build{margin-top:22px;border:1px solid var(--line);border-radius:18px;background:var(--card);padding:22px}
.scen-build h3{font-size:15px;margin-bottom:12px}
.pick-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.pick-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;font-size:12px;cursor:pointer;transition:.12s}
.pick-item:hover{border-color:var(--green)}
.pick-item input{accent-color:var(--green)}
.pick-item.on{background:#edf3e8;border-color:var(--green)}
/* 项目工作台 */
.proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-top:18px}
.proj-card{border:1px solid var(--line);border-radius:18px;background:var(--card);padding:20px;cursor:pointer;transition:.16s}
.proj-card:hover{border-color:var(--green);box-shadow:var(--shadow);transform:translateY(-2px)}
.proj-card h3{font-size:16px;margin-bottom:6px}
.proj-card p{font-size:11px;color:var(--muted);line-height:1.6;margin-bottom:10px}
.proj-card .tags{display:flex;flex-wrap:wrap;gap:5px}
.proj-card .tag{font-size:9px;background:#edf3e8;color:#385048;border-radius:999px;padding:3px 8px;font-weight:750}
/* 详情 */
.mask{position:fixed;inset:0;background:rgba(23,35,31,.5);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.mask.show{display:flex}
.modal{background:var(--card);border-radius:22px;max-width:720px;width:100%;max-height:88vh;overflow-y:auto;padding:30px;box-shadow:0 28px 80px rgba(0,0,0,.3)}
.modal h2{font-size:20px;margin-bottom:4px}
.modal .msub{color:var(--green);font-size:11px;font-weight:750;margin-bottom:14px}
.modal h4{color:var(--green);font-size:12px;margin:16px 0 6px;display:flex;align-items:center;gap:6px}
.modal h4::before{content:"";width:4px;height:13px;background:var(--green);border-radius:2px}
.modal h4.warn{color:var(--orange)}
.modal h4.warn::before{background:var(--orange)}
.modal p,.modal li{font-size:13px;line-height:1.75;color:var(--ink)}
.modal ul{padding-left:18px;margin:2px 0}
.modal li{margin-bottom:3px}
/* 互动清单(点一下=我做到了/我踩过) */
.modal ul.chklist{list-style:none;padding-left:0;margin:4px 0}
.modal ul.chklist li.chk{display:flex;gap:8px;align-items:flex-start;padding:6px 10px;border-radius:10px;border:1px solid transparent;cursor:pointer;user-select:none;transition:.12s;margin-bottom:2px}
.modal ul.chklist li.chk:hover{background:rgba(0,0,0,.04);border-color:var(--line)}
.modal ul.chklist li.chk .box{flex-shrink:0;width:20px;text-align:center;font-size:13px}
.modal ul.chklist li.chk .tx{flex:1;line-height:1.6}
.modal ul.chklist li.chk.done{opacity:.62}
.modal ul.chklist li.chk.done .tx{text-decoration:line-through;text-decoration-color:rgba(0,0,0,.25)}
.selfq{border:1px solid var(--line);background:#fff;color:var(--ink);font-size:12px;border-radius:999px;padding:5px 12px;cursor:pointer}
.selfq.on{border-color:var(--green);background:var(--green);color:#fff;font-weight:700}
/* 文档阅读壳(md → 可读排版) */
.mdh1{font-size:17px;font-weight:800;color:var(--ink);margin:16px 0 6px}
/* 术语词条: 可点击高亮(自动从词典md解析) */
mark.kterm{background:rgba(215,243,107,.28);border-bottom:1px dashed var(--green);cursor:pointer;border-radius:3px;padding:0 2px;color:inherit;font-size:inherit;font-weight:inherit;transition:background .1s}
mark.kterm:hover{background:rgba(215,243,107,.55)}
mark.kterm:focus-visible{outline:2px solid var(--green);outline-offset:1px}
.mdh2{font-size:15px;font-weight:750;color:var(--ink);margin:12px 0 4px}
.mdh3{font-size:13.5px;font-weight:700;color:var(--green);margin:10px 0 3px}
.mdul{margin:4px 0 8px;padding-left:20px}
.mdul li{font-size:13px;line-height:1.7;margin-bottom:2px}
.docbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 14px;border-radius:12px;background:rgba(215,243,107,.14);border:1px solid rgba(215,243,107,.4);margin-bottom:12px;font-size:12px;color:var(--ink)}
.x{float:right;background:var(--paper);border:1px solid var(--line);border-radius:10px;width:30px;height:30px;color:var(--muted);font-size:14px;cursor:pointer}
.x:hover{color:var(--green);border-color:var(--green)}
.links{display:grid;gap:8px;margin-top:8px}
.link-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:#f7f6ef;text-decoration:none;color:var(--ink);transition:.15s}
.link-row:hover{border-color:var(--green);background:#f0f4e6}
.link-row .star{color:var(--green);font-weight:800;font-size:11px;min-width:52px}

{st:"c3",t:"FDE 接客闸门：这单能不能接？（PSF 三关）",when:"来了新客户需求，先判断能不能接、怎么验证，再谈方案时",what:"从范冰《前线部署工程师》提炼的接客闸门：先判断该不该接，再谈怎么做。①PSF 三关——痛点关（哪个具体的人、哪个具体的痛、每天浪费多少时间？）→ 经济性关（解决值多少钱？算得清账吗？）→ 可行性关（数据在哪、什么状态？准确率门槛多少？）。②高危信号——无主之地（只有信息部对接没有业务负责人）/ 只许看不给碰（要证明但不给真数据）/ 宇宙级需求（第一次就要覆盖全公司）。③MVD 军规——真实数据无例外 / 缩小范围不砍价值 / 截止时间以周计（两周冲刺：第一周接数据定指标，第二周单点原型周末演示，当场决定放大/调整/散伙）。",how:["接客前先问 4 个问题过闸：谁最痛/省下时间值多少钱/数据在哪能给吗/两周内谁能拍板","客户答得上来 → 放心接，往方案走；答不上来 → 帮他把需求理清，或诚实说「这单现在接不了，差在 XX」","给方案时按 MVD 出「两周验证」而不是一上来报全厂价","识别「全自动群发/覆盖全场景」类宇宙需求 → 敢拒绝，把「现在不做」翻译成「什么时候做」"],bad:["有单就接，不判断能不能做对（错问题的执行力是浪费）","用演示数据验证（假数据成立的方案上线就撞真字段）","把 MVD 做成阉割版大方案（砍价值只砍范围）","第一次会议就答应覆盖全公司所有场景"],tool:"gate"},

{st:"c4",t:"AWS Well-Architected ML Lens（AI系统四支柱体检）",when:"给客户现有AI系统做体检/找差距、产出售前交付物时",what:"AWS 云良好架构的机器学习扩展：数据/建模/部署/运营 四大支柱+审查问题清单。审查问卷=现成的体检工具，答完=差距报告。",how:["四支柱逐项过问卷（每支柱一组问题）","❌项带改法（不是只打分）","产出差距报告=可直接发给客户的售前交付物","每季度重审一次（系统在变）"],bad:["只背书不落地（评完无行动项）","体检只查技术不查数据质量"],tool:"eval",eval:{groups:[{name:"数据支柱",items:[{q:"客户数据集中、可追溯、有血缘吗？",good:"有统一数据源+数据血缘",fix:"先建数据清单，再谈 AI"},{q:"数据质量有基线指标吗？",good:"有质量基线并持续监控",fix:"先定质量基线，再建模"}]},{name:"建模与部署支柱",items:[{q:"模型版本、数据版本、代码版本能对应吗？",good:"有模型注册+版本管理",fix:"上 MLflow/模型注册表"},{q:"上线有灰度/回滚方案吗？",good:"有金丝雀发布+自动回滚",fix:"部署先做灰度，不一把梭"}]},{name:"运营支柱",items:[{q:"生产模型有监控（漂移/质量）吗？",good:"有指标监控+告警",fix:"接可观测，指标围绕业务"},{q:"出问题能定位是哪次改动导致吗？",good:"有 trace 可回放",fix:"接 trace，改动留痕"}]}]},links:[{n:"AWS ML Lens 官方",d:"四支柱审查文档",u:"https://docs.aws.amazon.com/wellarchitected/latest/machine-learning-lens/welcome.html"}]},
{st:"c4",t:"NIST AI RMF（AI 风险管理四职能）",when:"客户要建 AI 治理/风控体系（央国企/金融客户必引）时",what:"美国国家标准院的 AI 风险管理框架：Govern治理→Map映射→Measure度量→Manage管理 四职能循环。是写治理方案的第一引用。",how:["①Govern：先定责任人、政策、流程","②Map：识别风险场景（这个AI用在什么决策上？）","③Measure：量化风险（准确率之外：偏见/安全/隐私）","④Manage：处置与缓解措施落地","每职能有 NIST 官方行动清单，可抄成客户的治理文档"],bad:["治理文档写完不执行","只测准确率不测风险","等出事才想起治理"],links:[{n:"NIST AI RMF 官方",d:"风险管理框架全文",u:"https://www.nist.gov/itl/ai-risk-management-framework"}]},
{st:"c4",t:"EU AI Act（四级风险分级自查）",when:"出海/外资客户、要做合规红线尽调时",what:"欧盟 AI 法案：按风险分四级——不可接受（禁止）/高风险（要合规评估+日志）/有限（要透明披露）/最低。合规差距=咨询单入口。",how:["先判断：客户的 AI 属于哪一级？","不可接受级（如社会评分）=直接劝退，不接","高风险级：合规评估+数据日志+人工监督三件套","有限风险级：至少透明披露（告诉用户是AI）","每条红线过一遍=合规尽调交付物"],bad:["把法案当翻译件看（客户要的是合规方案）","所有 AI 都按高风险做（过度合规=劝退客户）","忽略中国企业出海场景（欧盟客户才适用）"],tool:"eval",eval:{groups:[{name:"风险分级自查",items:[{q:"客户的 AI 会做「不可逆/高风险」决策吗（信贷/招聘/医疗）？",good:"有明确人工复核环节",fix:"按高风险级要求补合规评估+日志"},{q:"客户业务涉及欧盟用户吗？",good:"不涉及欧盟=可暂不适用",fix:"涉及欧盟=按 EU AI Act 分级过一遍"},{q:"AI 输出用户知道是 AI 吗？",good:"有透明披露",fix:"加「AI 生成」标识"}]}]},links:[{n:"EU AI Act 官方站",d:"法案全文与分级",u:"https://artificialintelligenceact.eu/"}]},
{st:"c4",t:"ISO/IEC 42001（AI管理体系认证=高客单价入口）",when:"客户要「AI 管理体系认证」、想立一个高客单价咨询项目时",what:"全球首个 AI 管理体系认证标准（对标 ISO 27001 之于信息安全）。证明组织 AI 治理成熟，是能立项的咨询入口。",how:["按 AIMS 要求建管理体系：政策/流程/审计","先做差距评估（gap assessment）再认证","认证流程：差距评估→体系建设→外部审核","给客户的话术：认证=给客户/监管看的治理证明"],bad:["只买证书不建体系（审核过不了）","小客户推认证=劝退（成本高，适合中大企业）","没有咨询经验硬接认证项目"],links:[{n:"ISO 42001 标准页",d:"标准原文(需购买)",u:"https://www.iso.org/standard/81230.html"}]},
{st:"c4",t:"Gartner AI TRiSM（可信AI五维盘点）",when:"给客户做 AI 治理成熟度盘点、画路线图时",what:"Gartner 可信 AI 五维：可信性/安全/公平/隐私/责任 + LLM 可观测治理。用 Gartner 语言跟客户 IT 部门对话。",how:["五维逐项打分（1-5 分）","LLM 输出要可观测可审计（trace+日志）","按最低分维度排治理路线图优先级","产出：五维雷达+行动清单=治理交付物"],bad:["只有原则没有检查项","治理与业务脱节（不为业务创造价值）","LLM 输出黑盒不审计"],links:[{n:"Gartner AI TRiSM 介绍",d:"概念与五维说明",u:"https://www.gartner.com/en/articles/what-is-ai-trism"}]},
{st:"c4",t:"Building Effective Agents（要不要上 Agent 的决策框架）",when:"客户问「我们要不要上 AI Agent」时",what:"Anthropic 官方方法论：工作流 vs 智能体之辨 + 「从简单到复杂」升级法则——先工作流（编排好的步骤）后智能体（自主决策）。",how:["先问：这个任务的每一步是确定的吗？","确定→用工作流（步骤写死、可控）；不确定→才考虑 Agent","升级路径：提示词→检索增强→工作流→Agent","每个升级点都要有评估门槛（效果没达标不升级）"],bad:["一上来就上 Agent（复杂、难控、成本高）","为 Agent 而 Agent（客户要的是解决问题）","Agent 不做护栏=乱跑"],links:[{n:"Anthropic 原文",d:"Building Effective Agents 全文",u:"https://www.anthropic.com/research/building-effective-agents"}]},
{st:"c4",t:"Context Engineering（上下文工程=Agent 核心能力）",when:"设计 RAG/Agent 的上下文、要补强自有 Agent 方法论时",what:"Anthropic 新方法论：把 prompt/工具/RAG/记忆 当系统设计的一门工程学科。Agent 质量=上下文质量。",how:["上下文四要素：指令 prompt/工具定义/检索内容/对话记忆","每要素版本化+评测（改完跑回归）","上下文精简：只给任务需要的（越长越贵越易错）","工具定义要清晰（名字+参数+何时用）"],bad:["上下文无脑堆（贵+错）","prompt 改完无版本（坏了不知道）","工具给太多（模型选不过来）"],links:[{n:"Anthropic 原文",d:"Effective Context Engineering 全文",u:"https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents"}]},
{st:"c4",t:"RAG 最佳实践（知识库问答标准五步）",when:"做知识库问答/RAG 项目、投标验收时",what:"微软 RAG 模式官方口径：索引→检索→增强→生成 + 评估维度。是 RAG 项目投标与验收的权威技术口径。",how:["①数据清洗：去重去噪","②切块：按语义块切（别整篇一块）","③索引：向量+关键词混合（hybrid）","④检索：召回→重排（rerank）","⑤生成：答案必须带引用（可溯源）","评估四维：忠实度/相关性/上下文精确率/召回率"],bad:["整个文档当一块切","只靠向量检索（要 hybrid+重排）","答案不可溯源（幻觉源头）","上线后不监控检索质量"],links:[{n:"微软 RAG 官方文档",d:"RAG 模式与评估",u:"https://learn.microsoft.com/en-us/azure/search/retrieval-augmented-generation-overview"}]},
{st:"c4",t:"Agent 生命周期 Build-Eval-Observe（四段周期）",when:"管理 Agent 项目全流程、向客户交付可观测 Agent 时",what:"构建→评测→观测→迭代 四段周期：Agent 不是一次写出来的，是循环打磨出来的。",how:["Build：先小后大（最小可用 Agent）","Eval：每次改动跑评测集（防回退）","Observe：生产可观测（trace/日志/成本/质量）","Iterate：用生产数据驱动迭代","给客户交付「可观测模块」=验收有账可查"],bad:["只 Build 不 Eval（改坏了不知道）","上线不观测=盲飞","评测集不随项目长大"],links:[{n:"Azure AI Foundry Agents",d:"微软 Agent 官方文档",u:"https://learn.microsoft.com/en-us/azure/ai-foundry/agents/overview"}]},
{st:"c4",t:"评估四件套选型（RAGAS/DeepEval/promptfoo/LLM-as-judge）",when:"要给 AI 项目定验收标准、选评测工具时",what:"业界共识的四件套：RAG 专用 RAGAS / LLM 框架 DeepEval / 提示词回归 promptfoo / 强模型当裁判 LLM-as-judge。",how:["RAG 项目→RAGAS 四指标（忠实度/相关/精确率/召回率）","Agent/LLM 应用→DeepEval（20+ 指标，可进 CI）","提示词迭代→promptfoo（多模型对比+回归）","自动评估→LLM-as-judge（参考 OpenAI Evals）","配合自有黄金集：黄金集测方案推荐，四件套测 RAG/Agent 质量"],bad:["凭感觉评估（「感觉不错」不算验收）","没有基线/黄金集","只测一次不回归（改一次坏一次不知道）"],tool:"usecase",use:{pros:["开源免费，社区大","四件套互补覆盖 RAG/Agent/提示词全场景","可与 CI 集成=自动化验收，防假绿"],cons:["要学四个工具（上手成本）","LLM-as-judge 有裁判偏好，要校准","指标≠业务效果，要结合人工抽检"],when_use:"任何 AI 项目定验收标准时；给客户交付前必须跑评测",when_not:"纯演示/原型（先跑通再说）；客户没数据基线时别硬上",first_step:"1) RAG 项目先跑 RAGAS 四指标 2) Agent 项目接 DeepEval 进 CI 3) promptfoo 管提示词回归 4) 与自有黄金集双轨跑"},links:[{n:"RAGAS",d:"RAG 评测库",u:"https://github.com/explodinggradients/ragas"},{n:"DeepEval",d:"LLM 评测框架",u:"https://github.com/confident-ai/deepeval"},{n:"promptfoo",d:"提示词回归测试",u:"https://github.com/promptfoo/promptfoo"}]},

  });

/* —— 来源可信度徽章(D): 卡片 st 前缀 → 真实/调研/AI 生成/框架 —— */
function trustOf(c){
  if(!c) return {k:"", label:""};
  var st = c.st || "";
  // 官方框架(AWS/Azure 等): A/B 单字母大写
  if(/^[AB]$/.test(st)) return {k:"frame", label:"🏛️ 框架"};
  // 决策卡 c1-c4 / 复盘 r1-r3 / 审计 a1-a4 = 真实项目经验
  if(/^[cra]\d$/.test(st)) return {k:"real", label:"🏗️ 真实"};
  // 关卡卡/方法论卡 C-K 单字母
  if(/^[CDEFGHIJK]$/.test(st)){
    if(/★|⭐/.test(c.t || "")) return {k:"research", label:"📚 调研"};
    return {k:"method", label:"🧭 方法"};
  }
  // 其他兜底: 标题含星标=调研
  if(/★|⭐/.test(c.t || "")) return {k:"research", label:"📚 调研"};
  return {k:"method", label:"🧭 方法"};
}
function trustBadge(c){
  var t = trustOf(c);
  if(!t.label) return "";
  return '<span class="trust trust-' + t.k + '" title="来源可信度：' + t.label + '（' + t.k + '）">' + t.label + '</span> ';
}

/* ---- 简易 markdown → html (够读书用: 标题/列表/引用/加粗/段落) ---- */
function simpleMd(md){
  var lines = (md || "").split("\n");
  var out = "", inList = false, inQuote = false;
  function closeList(){ if(inList){ out += "</ul>"; inList = false; } }
  function closeQuote(){ if(inQuote){ out += "</blockquote>"; inQuote = false; } }
  lines.forEach(function(line){
    var t = line.replace(/^#+\s*/, function(m){ return m; });
    if(/^#{1,3}\s/.test(line)){
      closeList(); closeQuote();
      var lvl = line.match(/^(#+)/)[1].length;
      var txt = inlineMd(line.replace(/^#+\s*/, ""));
      out += (lvl === 1 ? '<h2 style="font-size:20px;margin:18px 0 8px;color:#222">' : lvl === 2 ? '<h3 style="font-size:17px;margin:16px 0 6px;color:#333">' : '<h4 style="font-size:15px;margin:14px 0 4px;color:#444">') + txt + "</h" + (lvl===1?2:lvl===2?3:4) + ">";
    } else if(/^\s*[-*]\s+/.test(line)){
      closeQuote();
      if(!inList){ out += "<ul>"; inList = true; }
      out += "<li style='margin:3px 0'>" + inlineMd(line.replace(/^\s*[-*]\s+/, "")) + "</li>";
    } else if(/^\s*\d+\.\s+/.test(line)){
      closeQuote();
      if(!inList){ out += "<ol>"; inList = true; }
      out += "<li style='margin:3px 0'>" + inlineMd(line.replace(/^\s*\d+\.\s+/, "")) + "</li>";
    } else if(/^>\s?/.test(line)){
      closeList();
      if(!inQuote){ out += "<blockquote style='border-left:3px solid #d8b365;margin:8px 0;padding:2px 12px;color:#666;background:#faf7f0'>"; inQuote = true; }
      out += inlineMd(line.replace(/^>\s?/, "")) + "<br>";
    } else if(/^\s*$/.test(line)){
      closeList(); closeQuote();
    } else {
      closeList(); closeQuote();
      out += "<p style='margin:8px 0'>" + inlineMd(line) + "</p>";
    }
  });
  closeList(); closeQuote();
  return out;
}
function inlineMd(t){
  return esc(t)
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/\*([^*]+)\*/g, "<i>$1</i>")
    .replace(/`([^`]+)`/g, "<code style='background:#f4f4f2;padding:1px 5px;border-radius:4px;font-size:.9em'>$1</code>")
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" style="color:#4a7a2e">$1</a>');
}

var TERM_IDX = null, KB_LINKS = null, TERM_VIDMAP = null, VL_ITEMS = null;
function escq(s){ return String(s||"").replace(/[.*+?^${}()|[\]\\]/g,"\\$&"); }
function loadTermAssets(cb){
  var done = 0, need = 3;
  function fin(){ if(++done >= need && cb) cb(); }
  // 1. 词典 md → 词条索引
  fetch("/obs/成长系统/12_关键术语词典_v1.md").then(function(r){ return r.text(); }).then(function(md){
    TERM_IDX = {};
    var sec = "";
    md.split("\n").forEach(function(line){
      var sm = line.match(/^##\s*(.+)/);
      if(sm){ sec = sm[1].trim(); return; }
      var m = line.match(/^\|\s*\*\*([^*|]{1,60}?)\*\*/);
      if(m){
        var raw = m[1].trim();
        var em = line.match(/（([A-Za-z][A-Za-z .\-/]{1,40})）/);
        // 拆别名: "A / B"、"A（B）"、"A / B（C）" → 多键注册, 主键=第一个
        var keys = [];
        var noParen = raw.replace(/[（(].*?[)）]/g, " ");
        noParen.split("/").forEach(function(k){
          k = k.trim();
          if(k.length >= 2 && keys.indexOf(k) < 0) keys.push(k);
        });
        // 中英混排长键如 "麦肯锡 REWIRED" → 拆成 "麦肯锡"+"REWIRED" 独立键
        var extra = [];
        keys.forEach(function(k){
          if(/[A-Za-z]{2,}/.test(k) && k.indexOf(" ") >= 0){
            k.split(/\s+/).forEach(function(p){
              p = p.trim();
              if(p.length >= 2 && keys.indexOf(p) < 0 && extra.indexOf(p) < 0) extra.push(p);
            });
          }
        });
        extra.forEach(function(p){ keys.push(p); });
        if(!keys.length && raw.length >= 2) keys.push(raw);
        keys.forEach(function(cn){
          if(!TERM_IDX[cn]) TERM_IDX[cn] = {cn: cn, en: em ? em[1] : "", sec: sec, line: line, raw: raw};
        });
      }
    });
    fin();
  }).catch(function(){ fin(); });
  // 2. kb_links.json → 词条关联(只有id)
  fetch("/kb_links.json").then(function(r){ return r.json(); }).then(function(d){
    KB_LINKS = d.terms || {};
    fin();
  }).catch(function(){ fin(); });
  // 3. videos_library.json → 视频详情(懒加载)
  fetch("/videos_library.json").then(function(r){ return r.json(); }).then(function(d){
    VL_ITEMS = {};
    (d.cats||[]).forEach(function(c){ (c.items||[]).forEach(function(it){ VL_ITEMS[it.id] = it; }); });
    fin();
  }).catch(function(){ fin(); });
}
function termVideos(termKey){
  var bl = KB_LINKS && KB_LINKS[termKey];
  if(!bl || !bl.videos) return [];
  return bl.videos.map(function(vid){ return VL_ITEMS && VL_ITEMS[vid]; }).filter(Boolean);

function enrichTerms(container){
  if(!container || !TERM_IDX) return;
  var names = Object.keys(TERM_IDX).sort(function(a,b){ return b.length - a.length; });
  if(!names.length) return;
  var re = new RegExp("(" + names.map(escq).join("|") + ")", "g");
  var walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, {
    acceptNode: function(node){
      var p = node.parentElement;
      if(!p) return NodeFilter.FILTER_REJECT;
      if(p.closest && p.closest("code,pre,a,h1,h2,h3,button,.kterm,.docbar")) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  var nodes = [], n;
  while((n = walker.nextNode())) nodes.push(n);
  var count = 0, MAXH = 500, perWord = {};
  nodes.forEach(function(tn){
    var txt = tn.nodeValue;
    if(!txt || !re.test(txt)) return;
    re.lastIndex = 0;
    if(!re.test(txt)) return;
    re.lastIndex = 0;
    var frag = document.createDocumentFragment();
    var last = 0, m;
    while((m = re.exec(txt))){
      if(count >= MAXH) break;
      var word = m[0];
      if((perWord[word] || 0) >= 12){ if(m.index > last) frag.appendChild(document.createTextNode(txt.slice(last, m.index))); last = m.index + word.length; continue; }
      if(m.index > last) frag.appendChild(document.createTextNode(txt.slice(last, m.index)));
      var span = document.createElement("mark");
      span.className = "kterm";
      span.setAttribute("data-k", word);
      span.setAttribute("tabindex", "0");
      span.setAttribute("role", "button");
      span.textContent = word;
      frag.appendChild(span);
      count++;
      perWord[word] = (perWord[word] || 0) + 1;
      last = m.index + word.length;
    }
    if(last < txt.length) frag.appendChild(document.createTextNode(txt.slice(last)));
    if(count > 0) tn.parentNode.replaceChild(frag, tn);
  });
}

function installSections(md){
  /* 按 #/## 标题切 section(### 及更深留在本步内); 代码块内不切; 首页 # 📦 不进面板 */
  var lines = String(md||"").split(/\n/);
  var secs = [], cur = null, inCode = false;
  function push(){ if(cur && (cur.body.length || cur.title)) secs.push(cur); }
  lines.forEach(function(line){
    var t = line.trim();
    if(t.indexOf("```") === 0){ inCode = !inCode; if(!cur){ cur = {level:0, title:"", body:[]}; } cur.body.push(line); return; }
    if(inCode){ cur.body.push(line); return; }
    var m = line.match(/^(#{1,4})\s+(.*)$/);
    if(m){
      var title = m[2].trim();
      var lv = m[1].length;
      if(lv === 1 && title.indexOf("📦") >= 0){ push(); cur = null; return; }
      if(lv <= 2){ push(); cur = {level:lv, title:title, body:[]}; }
      else { if(!cur){ cur = {level:0, title:"", body:[]}; } cur.body.push(line); }
    }
    else { if(!cur) cur = {level:0, title:"", body:[]}; cur.body.push(line); }
  });
  push();

}

function opHist(){ try { return JSON.parse(localStorage.getItem("op_hist") || "[]"); } catch(e){ return []; } }
function opSaveHist(h){ try { localStorage.setItem("op_hist", JSON.stringify(h.slice(-30))); } catch(e){} }
function opRender(){
  var box = document.getElementById("opChat");
  if(!box) return;
  var h = opHist();
  if(!h.length){ box.innerHTML = '<div style="color:var(--muted);text-align:center;padding:26px 0">👋 直接在这里指挥 agent。<br>问它问题、让它改网页（自动备份+自测）、让它去学新东西。<br>发第一条试试 ↓</div>'; return; }
  var html = "";
  h.forEach(function(m){
    if(m.role === "user"){
      html += '<div style="display:flex;justify-content:flex-end;margin:6px 0"><div style="max-width:82%;background:#e7f0ff;border-radius:12px 12px 2px 12px;padding:8px 12px;white-space:pre-wrap;word-break:break-word">' + esc(m.content) + '</div></div>';
    } else if(m.role === "status"){
      html += '<div style="text-align:center;color:#b8860b;font-size:12px;margin:4px 0">' + esc(m.content) + '</div>';
    } else {
      var isErr = m.content.indexOf("❌") === 0 || m.content.indexOf("失败") !== -1 && m.content.length < 80;
      html += '<div style="display:flex;justify-content:flex-start;margin:6px 0"><div style="max-width:88%;background:#f4f1e8;border:1px solid #e6e0d0;border-radius:12px 12px 12px 2px;padding:8px 12px;white-space:pre-wrap;word-break:break-word;' + (isErr ? 'color:#c0392b' : '') + '">' + esc(m.content) + '</div></div>';
    }
  });
  box.innerHTML = html;
  box.scrollTop = box.scrollHeight;
}
function opClear(){
  if(opHist().length && !confirm("清空操作台对话历史？")) return;
  localStorage.removeItem("op_hist");
  opRender();
}
function opAdd(role, content){
  var h = opHist(); h.push({role: role, content: content}); opSaveHist(h); opRender();
}
function opSend(kind){
  var inp = document.getElementById("opInput");
  var q = inp ? inp.value.trim() : "";
  if(!q){ toast("先输入指令"); return; }
  inp.value = "";
  opAdd("user", q);
  opAdd("status", kind === "do" ? "⚡ 已派 agent 干活（可能要 1-3 分钟，可先干别的，好了会显示）…" : "💬 agent 思考中（约 30-60s）…");
  var btns = document.querySelectorAll(".op-go");
  var api = kind === "do" ? "/api/do" : "/api/ask";
  var payload = {q: q, history: opHist().filter(function(m){ return m.role === "user" || m.role === "assistant"; }).slice(0, 8)};
  fetch(api, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(payload)})
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(d.ok){
        opPoll(d.tid, kind);
      } else {
        opAdd("status", "⚠️ 提交失败: " + (d.error || ""));
      }
    })
    .catch(function(e){ opAdd("status", "⚠️ 网络错误: " + e); });
}
function opPoll(tid, kind){
  var tries = 0;
  var timer = setInterval(function(){
    tries++;
    fetch("/api/ask_result?tid=" + tid).then(function(r){ return r.json(); }).then(function(d){
      if(d.status === "done"){
        clearInterval(timer);
        // 移除"思考中"占位
        var h = opHist();
        for(var i = h.length - 1; i >= 0; i--){ if(h[i].role === "status"){ h.splice(i, 1); break; } }
        opSaveHist(h);
        opAdd("assistant", d.answer || "(空回答)");
      } else if(d.status === "error"){
        clearInterval(timer);
        var h2 = opHist();
        for(var i2 = h2.length - 1; i2 >= 0; i2--){ if(h2[i2].role === "status"){ h2.splice(i2, 1); break; } }
        opSaveHist(h2);
        opAdd("assistant", "❌ " + (d.answer || "agent 出错了"));
      } else if(tries > 240){ // 最多等 8 分钟(派活)
        clearInterval(timer);
        opAdd("status", "⏰ 等待超时，agent 可能还在跑，刷新页面看结果");
      }
    }).catch(function(){});
  }, 2000);
}

/* —— 文档阅读壳: 点文档不再裸开 md, 包一层(这是什么→可读正文→对我有用吗自评) —— */
function mdInline(s){
  var h = esc(s);
  h = h.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function(m, txt, url){ return '<a href="' + url.replace(/ /g, "%20") + '" style="color:#3f7a2e;text-decoration:underline;cursor:pointer;font-weight:600">' + txt + '</a>'; });
  return h.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code style='background:#f0f3e8;padding:1px 5px;border-radius:5px;font-size:12px'>$1</code>");
}
function mdTableBlock(block){
  var rows = block.split(/\n/).map(function(s){ return s.trim(); }).filter(function(s){ return s.indexOf("|") >= 0; });
  if(rows.length < 2) return null;
  var sep = rows[1] || "";
  if(!/^\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?$/.test(sep)) return null;
  var out = "<div style='overflow-x:auto;margin:8px 0'><table style='border-collapse:collapse;width:100%;font-size:12px;line-height:1.6'>";
  for(var ri=0; ri<rows.length; ri++){
    if(ri === 1) continue;
    var cells = rows[ri].replace(/^\|/, "").replace(/\|$/, "").split("|").map(function(c){ return c.trim(); });
    var tag = ri === 0 ? "th" : "td";
    out += "<tr>";
    cells.forEach(function(c){
      out += "<" + tag + " style='border:1px solid #dcded7;padding:5px 9px;text-align:left;vertical-align:top;background:" + (ri===0 ? "#eef2e3" : "#fff") + "'>" + mdInline(c) + "</" + tag + ">";
    });
    out += "</tr>";
  }
  out += "</table></div>";
  return out;
}
function mdToHtml(md){
  var lines = String(md || "").split(/\n/);
  var h = "", inCode = false, codeBuf = [], inUl = false, tblBuf = [];
  function flushTbl(){
    if(tblBuf.length){
      var tb = mdTableBlock(tblBuf.join("\n"));
      h += tb || tblBuf.map(function(l){ return "<div style='font-size:12px;line-height:1.7;color:var(--ink);padding-left:4px'>" + esc(l) + "</div>"; }).join("");
      tblBuf = [];
    }
  }
  lines.forEach(function(line){
    var t = line.trim();
    if(t.indexOf("```") === 0){
      flushTbl();
      if(inCode){ h += "<pre style='background:#f4f6ee;padding:10px;border-radius:10px;font-size:12px;overflow-x:auto'>" + esc(codeBuf.join("\n")) + "</pre>"; codeBuf = []; inCode = false; }
      else { inCode = true; }
      return;
    }
    if(inCode){ codeBuf.push(line); return; }
    if(/^\|.*\|$/.test(t)){ if(inUl){ h += "</ul>"; inUl = false; } tblBuf.push(t); return; }
    flushTbl();
    if(/^#{1,4}\s/.test(t)){
      if(inUl){ h += "</ul>"; inUl = false; }
      var lv = t.match(/^#+/)[0].length;
      var cls = lv <= 1 ? "mdh1" : lv === 2 ? "mdh2" : "mdh3";
      var title = t.replace(/^#+\s*/, "");
      var anchor = "";
      var am = title.match(/\s*\{#([A-Za-z0-9_-]+)\}\s*$/);
      if(am){ anchor = am[1]; title = title.replace(/\s*\{#([A-Za-z0-9_-]+)\}\s*$/, ""); }
      h += '<div class="' + cls + '"' + (anchor ? ' id="' + anchor + '" style="scroll-margin-top:14px"' : "") + ">" + esc(title) + "</div>";
      return;
    }
    if(/^[-*•]\s/.test(t)){
      if(!inUl){ h += "<ul class='mdul'>"; inUl = true; }
      h += "<li>" + mdInline(t.replace(/^[-*•]\s*/, "")) + "</li>";
      return;
    }
    if(/^\d+[.、]\s/.test(t)){
      if(!inUl){ h += "<ol class='mdul'>"; inUl = true; }
      h += "<li>" + mdInline(t.replace(/^\d+[.、]\s*/, "")) + "</li>";
      return;
    }
    if(/^&gt;\s?/.test(t) || /^>\s?/.test(t)){
      if(inUl){ h += "</ul>"; inUl = false; }
      h += "<div style='font-size:12px;line-height:1.7;color:#65736e;border-left:3px solid #d8e2c4;padding:2px 10px;margin:4px 0'>" + mdInline(t.replace(/^&gt;\s?/, "").replace(/^>\s?/, "")) + "</div>";
      return;
    }
    if(inUl){ h += "</ul>"; inUl = false; }
    if(!t) return;
    h += "<p style='font-size:13px;line-height:1.8;color:var(--ink)'>" + mdInline(t) + "</p>";
  });
  flushTbl();
  if(inCode) h += "<pre style='background:#f4f6ee;padding:10px;border-radius:10px;font-size:12px;overflow-x:auto'>" + esc(codeBuf.join("\n")) + "</pre>";
  if(inUl) h += "</ul>";
  return h;
}

/* —— 我的学习(B待复习 + E成长统计): 读 localStorage 勾选/自评/做题数据 —— */
function loadMine(){
  var box = document.getElementById("mineBoxInner");
  if(!box) return;
  // 连续访问(今天打卡)
  var today = new Date().toISOString().slice(0, 10);
  var days = [];
  try{ days = JSON.parse(localStorage.getItem("grow_days") || "[]"); }catch(e){}
  if(days[days.length - 1] !== today){
    days.push(today);
    if(days.length > 60) days = days.slice(-60);
    try{ localStorage.setItem("grow_days", JSON.stringify(days)); }catch(e){}
  }
  // 连续天数(从今天往前数, 中间断了就停)
  var streak = 0;
  var d = new Date();
  for(var i = 0; i < days.length; i++){
    var want = new Date(d.getTime() - i * 86400000).toISOString().slice(0, 10);
    if(days.indexOf(want) >= 0) streak++;
    else break;
  }
  // 扫描所有卡的学习状态
  var doneCards = 0, selfYes = 0, selfLater = 0, quizTried = 0, quizCorrect = 0, quizTotal = 0;
  var dueCards = []; // 该复习: 勾过照做 or 自评用上了, 但过了 ≥2 天(回来确认真用上了没)
  var now = Date.now();
  CARDS.forEach(function(c){
    var key = "grow_chk_" + c.t;
    var mem = {};
    try{ mem = JSON.parse(localStorage.getItem(key) || "{}"); }catch(e){}
    var howCount = (c.how || []).length;
    var did = 0;
    for(var i2 = 0; i2 < howCount; i2++){ if(mem["how" + i2]) did++; }
    if(did > 0) doneCards++;
    if(mem["self"] === "yes") selfYes++;
    if(mem["self"] === "later") selfLater++;
    if(did === howCount && howCount > 0 && !mem._doneAt){
      mem._doneAt = now;
      try{ localStorage.setItem(key, JSON.stringify(mem)); }catch(e){}
    }
    // 复习判定: 全勾完 >2 天前 且 没点过"还没用上", 回来确认真用上没
    var doneAt = mem._doneAt || 0;
    var ageDays = (now - doneAt) / 86400000;
    var selfNo = mem["self"] === "no";
    if(doneAt && ageDays >= 2 && !selfNo){
      dueCards.push({t: c.t, age: Math.round(ageDays)});
    }
    // 做题统计
    var qk = "grow_quiz_" + c.t;
    var qm = {};
    try{ qm = JSON.parse(localStorage.getItem(qk) || "{}"); }catch(e){}
    if(qm.n){ quizTried++; quizTotal += qm.n; quizCorrect += (qm.c || 0); }
  });
  // 最多显示 5 张待复习
  dueCards.sort(function(a, b){ return b.age - a.age; });
  var due = dueCards.slice(0, 5);
  var h = "";
  // E: 我的成长统计(标题由外层 .sec-title 提供)
  var correctRate = quizTotal ? Math.round(quizCorrect / quizTotal * 100) : 0;
  h += '<div class="stats-mine">' +
    '<div class="sm"><div class="num">' + days.length + '</div><div class="lbl">累计学习</div></div>' +
    '<div class="sm"><div class="num">' + streak + '</div><div class="lbl">连续天数</div></div>' +
    '<div class="sm"><div class="num">' + doneCards + '</div><div class="lbl">动过手的卡</div></div>' +
    '<div class="sm"><div class="num">' + selfYes + '</div><div class="lbl">说用上了</div></div>' +
    '<div class="sm"><div class="num">' + quizTried + '</div><div class="lbl">考过的卡</div></div>' +
    '<div class="sm"><div class="num">' + correctRate + '%</div><div class="lbl">答题正确率</div></div>' +
    "</div>";
  // B: 待复习
  if(due.length){
    h += '<div class="review-strip">📌 <b>该回来看看的 ' + due.length + ' 张卡</b>（勾完 ≥2 天了——真用上了吗？回来勾一下/评一下）';
    due.forEach(function(dd){
      h += '<div class="rv" onclick="openCard(\'' + dd.t.replace(/'/g, "\\'") + '\')">→ ' + esc(dd.t) + '（' + dd.age + ' 天前完成）</div>';
    });
    h += '</div>';
  }
  // 缺口: 该学清单
  h += gapsHtml(loadGaps());
  // 记缺口快捷入口
  h += '<div style="margin-top:8px;text-align:center"><button class="gap-act lk" style="padding:6px 14px" onclick="openGapModal(\'\')">📌 记一个「这次不会的」→ 该学</button></div>';
  box.innerHTML = h;
}

      tries++;

function renderSearch(content, eyebrow, title, crumb, q){
  eyebrow.textContent = view.ask ? "ASK ME" : "SEARCH";
  title.textContent = view.ask ? "问我 · " + q : "搜索 · " + q;
  crumb.innerHTML = '<a onclick="view={mode:\'home\'};renderAll()">工作台</a> › ' + (view.ask ? "问我" : "搜索") + ' "' + esc(q) + '"';
  var terms = q.toLowerCase().split(/\s+/).filter(Boolean);
  var hits = [];
  // 中文搜索：把查询拆成 2-3 字词组（获客/电商/数据库），词组命中标题权重最高
  // 英文/数字 term 整词匹配
  function chineseTokens(str){
    var tokens = [];
    var s = str.replace(/[a-z0-9★·（）()\-]/gi, " ");
    s = s.replace(/\s+/g, "");
    if(!s) return tokens;
    for(var i=0;i<s.length-1;i++){
      tokens.push(s.substr(i,2));
    }
    if(s.length >= 3){
      for(var i=0;i<s.length-2;i++){
        tokens.push(s.substr(i,3));
      }
    }
    // 去重
    var seen = {}, uniq = [];
    tokens.forEach(function(t){ if(!seen[t]){ seen[t]=1; uniq.push(t); } });
    return uniq;
  }
  var cjkTokens = chineseTokens(q);
  var alphaTerms = terms.filter(function(t){ return /[a-z0-9]/.test(t); });
  CARDS.forEach(function(c){
    var title = c.t.toLowerCase();
    var body = (c.what + " " + c.when + " " + c.how.join(" ") + " " + c.bad.join(" ") + " " + subName(c.st)).toLowerCase();
    var score = 0, hits2 = 0, hits3 = 0;
    // 英文/数字整词
    alphaTerms.forEach(function(t){
      if(title.indexOf(t) >= 0) score += 25;
      else if(body.indexOf(t) >= 0) score += 6;
    });
    // 中文 2-3 字词
    cjkTokens.forEach(function(tok){
      if(tok.length === 2){
        if(title.indexOf(tok) >= 0){ score += 12; hits2++; }
        else if(body.indexOf(tok) >= 0){ score += 3; }
      } else {
        if(title.indexOf(tok) >= 0){ score += 18; hits3++; }
        else if(body.indexOf(tok) >= 0){ score += 5; }
      }
    });
    // 词组长匹配加分（3字词命中标题非常相关）
    if(hits3 > 0) score += hits3 * 4;
    if(score > 0) hits.push({card:c, score:score, hits2:hits2, hits3:hits3});
  });
  hits.sort(function(a,b){ return b.score - a.score; });
  hits = hits.slice(0, 30);
  var html = "";
  // —— 深度绑定: ask 模式 = 派 Hermes agent 真答(不再只看本地卡匹配)
  if(view.ask){
    html += '<div style="background:rgba(215,243,107,.10);border:1px solid rgba(215,243,107,.3);border-radius:14px;padding:14px;margin-bottom:12px">' +
      '<div style="font-size:13px;font-weight:700;color:var(--ink);margin-bottom:6px">🤖 让 Hermes 真答你</div>' +
      '<div style="font-size:11.5px;color:var(--muted);margin-bottom:10px">不只搜卡——Hermes 会带记忆 + 全知识库 + 实战经验组装回答</div>' +
      '<button class="ask-btn" id="askAgentBtn" onclick="askAgent(\'' + esc(q).replace(/'/g, "\\'") + '\')">➤ 问 Hermes</button>' +
      '<div id="askAgentOut" style="margin-top:10px"></div></div>';
  }
  html += '<div class="results"><div class="rcount">找到 ' + hits.length + ' 条相关沉淀' + (view.ask ? "（本地卡匹配，供快速翻阅）" : "") + "</div>";
  if(view.ask && hits.length === 0){
    html += '<div class="empty">库里还没有相关内容。告诉我你遇到的具体场景，我帮你提炼后入库（候选池 → 三审 → 正式）。</div>';
  }
  var groups = {};
  hits.forEach(function(h){ var loc = subName(h.card.st); (groups[loc] = groups[loc] || []).push(h); });
  var gloc = Object.keys(groups);
  // 组间按组内最高分排序（高分在前），不再按组名字母序
  gloc.sort(function(a,b){
    var ma = groups[a].reduce(function(m,h){ return Math.max(m,h.score); }, 0);
    var mb = groups[b].reduce(function(m,h){ return Math.max(m,h.score); }, 0);
    return mb - ma;
  });
  gloc.forEach(function(g){
    html += '<div class="res-group"><h4>' + esc(g) + "</h4>";
    groups[g].forEach(function(h){
      html += '<div class="res-item" data-t="' + h.card.t.replace(/"/g,"&quot;") + '"><h5>' + esc(h.card.t) + '</h5>' +
        '<div class="w">' + esc(h.card.when) + "</div>" +
        '<div class="loc">' + esc(h.card.what.substring(0,80)) + "… → 点开看详情" + "</div></div>";
    });
    html += "</div>";
  });
  html += "</div>";
  html += '<div id="vaultHits" style="margin-top:6px"></div>';
  content.innerHTML = html;
  // 异步加载磁盘全库文档命中(镜子照全库, 不只前端精选)
  fetch("/api/search?q=" + encodeURIComponent(q)).then(function(r){ return r.json(); }).then(function(d){
    var box = document.getElementById("vaultHits");
    if(!box || !d.hits || d.hits.length === 0) return;
    var already = {};
    hits.forEach(function(h){ already[h.card.t.toLowerCase()] = 1; });
    var vh = d.hits.filter(function(h){
      var base = h.file.split("/").pop().replace(/\.md$/, "").toLowerCase();
      return !already[base];
    });
    if(vh.length === 0) return;
    var h2 = '<div class="rcount" style="margin-top:14px;border-top:1px dashed #e0dac8;padding-top:10px">📁 库内文档命中 ' + vh.length + ' 条（磁盘全文）</div>';
    vh.slice(0, 12).forEach(function(h){
      h2 += '<div class="res-item" style="cursor:pointer" onclick="window.open(\'/obs/' + encodeURIComponent(h.file).replace(/%2F/g, "/") + '\',\'_blank\')"><h5>📄 ' + esc(h.file) + '</h5><div class="loc">…' + esc(h.snippet) + '…</div></div>';
    });
    box.innerHTML = h2;
  }).catch(function(){});
}

/* ---- 自由拼装 ---- */
var combSelection = [];
var combTab = "f";
function renderComb(content, eyebrow, title, crumb){
  eyebrow.textContent = "FREE COMBINE";
  title.textContent = "自由拼装 · 自己挑功能点搭方案";
  crumb.textContent = "按主目录浏览所有沉淀，点「＋」加入你的方案；可移除 / 清空 / 导出";
  var html = '<div class="comb-wrap">';
  html += '<div class="comb-left"><div class="comb-tabs">';
  var dlabs = {f:"① 框架做对",c:"② 学别人的经验",r:"③ 我们的实战复盘",a:"④ 审核标准"};
  Object.keys(dlabs).forEach(function(d){
    html += '<div class="plan-tab' + (combTab===d?' on':'') + '" onclick="combSetTab(\'' + d + '\')">' + dlabs[d] + '</div>';
  });
  html += '</div><div class="comb-cards" id="combCards"></div></div>';
  html += '<div class="comb-right"><div class="comb-right-head">🛠 我的方案（<span id="combCount">0</span> 项）</div>';
  html += '<div class="comb-list" id="combList"></div>';
  html += '<div class="comb-actions"><button class="ask-btn" onclick="saveComb()">💾 保存方案</button>';
  html += '<button class="ask-btn" style="background:var(--orange);color:#fff" onclick="combAnalyze()">🔍 分析可行性</button>';
  html += '<button class="ask-btn" style="background:transparent;color:var(--ink);border:1px solid #d8d2c0" onclick="combExport()">复制</button>';
  html += '<button class="ask-btn" style="background:transparent;color:var(--ink);border:1px solid #d8d2c0" onclick="combClear()">清空</button></div></div></div>';
  content.innerHTML = html;
  combRenderCards();
  combRenderList();
}
function combSetTab(d){ combTab = d; combRenderCards(); }
function combBelongs(c, tab){
  // 框架做对(f): st 是单个大写字母 A-K；其他(c/r/a): st 以对应字母+数字开头
  if(tab === "f") return /^[A-K]$/.test(c.st);
  return c.st.indexOf(tab) === 0;
}
function combRenderCards(){
  var box = document.getElementById("combCards");
  if(!box) return;
  var html = "";
  CARDS.forEach(function(c){
    if(!combBelongs(c, combTab)) return;
    var inSel = combSelection.indexOf(c.t) >= 0;
    html += '<div class="comb-card"><div class="cc-main"><b>' + esc(c.t) + "</b><span>" + esc((c.what||"").slice(0,40)) + "</span></div>";
    html += inSel
      ? '<button class="cc-add on" onclick="combRemove(\'' + esc(c.t).replace(/'/g,"\\'") + '\')">已加入 ✓</button>'
      : '<button class="cc-add" onclick="combAdd(\'' + esc(c.t).replace(/'/g,"\\'") + '\')">＋ 加入</button>';
    html += "</div>";
  });
  box.innerHTML = html || '<div class="empty">该目录暂无内容</div>';
}
function combAdd(t){ if(combSelection.indexOf(t) < 0) combSelection.push(t); combRenderCards(); combRenderList(); }
function combRemove(t){ combSelection = combSelection.filter(function(x){ return x !== t; }); combRenderCards(); combRenderList(); }
function combClear(){ combSelection = []; combRenderCards(); combRenderList(); }
function combRenderList(){
  var box = document.getElementById("combList"), cnt = document.getElementById("combCount");
  if(!box) return;
  if(cnt) cnt.textContent = combSelection.length;
  if(!combSelection.length){ box.innerHTML = '<div class="empty">还没加入。从左边挑你需要的功能点 / 案例 / 坑。</div>'; return; }
  var html = "";
  combSelection.forEach(function(t){
    var c = CARDS.find(function(x){ return x.t === t; });
    var loc = c ? subName(c.st) : "";
    html += '<div class="comb-pick"><span class="cp-loc">' + esc(loc) + "</span>" + esc(t) + '<button class="cp-x" onclick="combRemove(\'' + esc(t).replace(/'/g,"\\'") + '\')">✕</button></div>';
  });
  box.innerHTML = html;
}
function combExport(){
  if(!combSelection.length){ toast("方案为空，先加入几项"); return; }
  var body = "【自由组合方案】" + new Date().toLocaleString("zh-CN") + "\n\n采用结构：\n" + combSelection.map(function(t){ return "- " + t; }).join("\n") + "\n";
  if(navigator.clipboard){ navigator.clipboard.writeText(body).then(function(){ toast("✅ 方案已复制到剪贴板"); }); }
  else { alert(body); }
}

/* ---- 可行性分析(需求4: 选N项→可/不可+理由) ---- */
function combAnalyze(){
  if(!combSelection.length){ toast("方案为空，先加入几项再分析"); return; }
  var sel = combSelection.join(" ");
  var issues = [];
  // 关键关卡依赖规则(来自 09 关卡地图): 做了 X 却没配 Y = 风险
  var rules = [
    {need:"用户上传/文件/图片/上传", ifMissing:["鉴权","认证","密钥管理","OWASP","安全基线"], risk:"用户上传 = 路径穿越高危入口，必须配鉴权/密钥/安全基线，否则等于把门敞开"},
    {need:"扣费/计费/积分/账单", ifMissing:["幂等"], risk:"涉及扣费必须幂等，否则用户连点/重试会重复扣费"},
    {need:"消息/私信/触达/发消息/邮件", ifMissing:["幂等","重试"], risk:"批量触达必须有幂等防重发+重试防漏发"},
    {need:"外部API/调用/模型/AI生成", ifMissing:["密钥管理","成本可观测"], risk:"调外部API必须管好密钥+看得见成本，否则泄漏或失控"},
    {need:"对外/生产/上线/部署/客户用", ifMissing:["审计日志","灰度发布","回滚","备份"], risk:"对外生产必须能审计(追责)+灰度(降风险)+回滚(出事了能退)"},
    {need:"数据库/存储/写入", ifMissing:["备份"], risk:"有数据就必须有备份，否则误删/灾难直接丢客户数据"},
    {need:"AI/LLM/Agent/大模型/问答", ifMissing:["幻觉护栏","质量评估","评测"], risk:"给客户用 AI 必须配幻觉护栏/质量评估，否则 AI 乱答毁信誉"},
    {need:"Agent/智能体/多Agent", ifMissing:["控制流","状态统一","转人工","上下文"], risk:"做 Agent 应用=做生产系统，12-Factor-Agents 真实原则(拥有控制流/统一状态/转人工用工具/拥有上下文窗口)缺了会踩「跑通但不可运维」的坑"}
  ];
  rules.forEach(function(r){
    var hit = false;
    // need 任一关键词出现在选择里
    var needParts = r.need.split("/");
    needParts.forEach(function(k){ if(sel.indexOf(k) >= 0) hit = true; });
    if(!hit) return;
    // 检查配套项有没有(每个配套关键词都不在)
    var missParts = [];
    var missAll = true;
    r.ifMissing.forEach(function(m){
      var has = sel.indexOf(m) >= 0;
      if(!has) missParts.push(m);
      else missAll = false;
    });
    // 配套项一个都没有 → 高风险; 部分没有 → 提示补
    if(missAll){
      issues.push({level:"🔴 高危缺失", text:"你选了「" + r.need.split("/")[0] + "」相关的功能，但完全没配 " + (r.ifMissing.join(" / ")) + "。风险：" + r.risk});
    } else if(missParts.length){
      issues.push({level:"🟡 建议补充", text:"选了「" + r.need.split("/")[0] + "」，建议再补 " + missParts.join(" / ") + "（已配 " + r.ifMissing.filter(function(m){return sel.indexOf(m)>=0;}).join("、") + "）"});
    }
  });
  var verdict;
  if(issues.length === 0){
    verdict = "✅ <b>可以做</b> — 你选的 " + combSelection.length + " 项覆盖了关键配套，没有明显高危缺失。建议对照 🗺️ 关卡地图确认你处在哪个阶段、该阶段关卡都过了。";
  } else {
    var high = issues.filter(function(i){ return i.level.indexOf("高危") >= 0; }).length;
    verdict = high > 0
      ? "⚠️ <b>不建议直接做</b> — 有 " + high + " 处高危缺失（见下），补齐前贸然做会踩「MVP跑通但不稳定」的坑（你三个项目都吃过这个亏）。"
      : "🟡 <b>可以做，但建议补强</b> — 没有高危缺失，补上建议项更稳。";
  }
  var html = '<div class="plan-detail" style="margin-top:14px;padding:16px 18px;border-radius:14px;background:#fff4df;border:1px solid #f0d9a8">' +
    '<div style="font-size:14px;font-weight:800;margin-bottom:10px">🔍 可行性分析（' + combSelection.length + ' 项）</div>' +
    '<div style="font-size:13px;line-height:1.7;margin-bottom:8px">' + verdict + '</div>';
  if(issues.length){
    html += '<div style="margin-top:6px">' + issues.map(function(i){
      return '<div style="padding:8px 10px;margin:5px 0;border-radius:8px;background:#fff;font-size:12px;line-height:1.6">' +
        '<b style="color:' + (i.level.indexOf("高危")>=0 ? "#c0392b" : "#b7791f") + '">' + i.level + '</b> ' + esc(i.text) + '</div>';
    }).join("") + '</div>';
  }
  html += '<div style="margin-top:10px;font-size:11px;color:#80522b">💡 规则来自 09_关卡地图（幂等/密钥/审计/回滚这些词该在哪一关用）。这只是静态检查，深度评估可丢给 agent 分析。</div></div>';
  // 在方案列表下方追加
  var list = document.getElementById("combList");
  var existing = document.getElementById("combAnalysisBox");
  if(existing) existing.remove();
  var box = document.createElement("div");
  box.id = "combAnalysisBox";
  box.innerHTML = html;
  list.parentNode.insertBefore(box, list.nextSibling);
}

function renderScen(content, eyebrow, title, crumb){
  eyebrow.textContent = "SCENARIO WIZARD";

  crumb.textContent = "选一个你正在做的事，我给 2 种做法供对比，每套含结构清单 / 理由 / 结论；也可自由拼装";
  var html = '<div class="scen-tpl">';
  SCENARIOS.forEach(function(s, i){
    html += '<div class="scen-tpl-card" onclick="buildScen(' + i + ')"><h3>' + esc(s.name) + "</h3><p>" + esc(s.desc) + "</p><div class='chips'>";
    var p0 = s.plans[0];
    p0.picks.slice(0,6).forEach(function(p){ html += '<span class="chip">' + esc(p.replace(/^[A-Za-z0-9]+/,"")) + "</span>"; });
    html += '<span class="chip">+' + (p0.picks.length - 6) + ' 更多 · 共 ' + s.plans.length + " 套方案</span></div></div>";
  });
  html += "</div>";
  html += '<div class="ft"><a href="#" onclick="view={mode:\'comb\',dir:null,sub:null};renderAll();return false;">🧩 不想选场景？ 去「自由拼装」自己搭 →</a></div>';
  content.innerHTML = html;
}
function buildScen(idx){
  var s = SCENARIOS[idx];
  var html = '<h3>📋 ' + esc(s.name) + "</h3><p style='color:var(--muted);font-size:12px'>" + esc(s.desc) + '</p>';
  html += '<div class="plan-tabs">';
  s.plans.forEach(function(p, pi){
    html += '<div class="plan-tab' + (pi===0?' on':'') + '" onclick="showPlan(' + idx + ',' + pi + ')">' + esc(p.name) + "</div>";
  });
  html += "</div>";
  html += '<div id="planBody"></div>';
  var content = document.getElementById("content");
  var extra = document.createElement("div");
  extra.innerHTML = html;
  content.appendChild(extra);
  showPlan(idx, 0);
}
function showPlan(si, pi){
  var s = SCENARIOS[si], p = s.plans[pi];
  document.querySelectorAll(".plan-tab").forEach(function(t, i){ t.classList.toggle("on", i===pi); });
  var html = '<div class="plan-detail">';
  html += '<div class="plan-head">' + esc(p.name) + " <span class='plan-desc'>" + esc(p.desc) + "</span></div>";
  html += '<div class="plan-sec"><h4>✅ 用这套结构</h4><div class="pick-list">';
  p.picks.forEach(function(pk){
    html += '<div class="pick-item on"><input type="checkbox" checked onchange="this.parentElement.classList.toggle(\'on\', this.checked)">' + esc(pk.replace(/^[A-Za-z0-9]+/,"")) + '</div>';
  });
  html += "</div></div>";
  html += '<div class="plan-sec"><h4>💡 为什么这样搭</h4><div class="plan-why">' + esc(p.why.join("；")) + "</div></div>";
  html += '<div class="plan-sec"><h4>⚖️ 结论与权衡</h4><div class="plan-concl">' + esc(p.conclusion) + "</div></div>";
  html += '<div class="plan-sec"><button class="ask-btn" onclick="savePlan(' + si + ',' + pi + ')">💾 保存此方案（落方案库，可复用）</button> <button class="ask-btn" style="background:transparent;color:var(--ink);border:1px solid #d8d2c0" onclick="exportPlan(' + si + ',' + pi + ')">📤 复制文本</button></div>';
  html += "</div>";
  var pb = document.getElementById("planBody");
  if(pb) pb.innerHTML = html;
}
function exportPlan(si, pi){
  var s = SCENARIOS[si], p = s.plans[pi];
  var body = "【项目方案】" + s.name + " · " + p.name + "\n\n适用：" + p.desc + "\n\n采用结构：\n" + p.picks.map(function(x){return "- " + x.replace(/^[A-Za-z0-9]+/,"");}).join("\n") + "\n\n为什么这样搭：\n" + p.why.join("；") + "\n\n结论与权衡：\n" + p.conclusion + "\n";
  if(navigator.clipboard){ navigator.clipboard.writeText(body).then(function(){ toast("✅ 方案已复制到剪贴板，可粘贴到笔记/文档"); }); }
  else { alert(body); }
}
function savePlan(si, pi){
  var s = SCENARIOS[si], p = s.plans[pi];
  var name = s.name + " · " + p.name;
  var picks = p.picks.map(function(x){return x.replace(/^[A-Za-z0-9]+/,"");});
  fetch("/api/save_plan", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({name:name, picks:picks, why:p.why.join("；"), concl:p.conclusion, src:"场景向导"})})
    .then(function(r){return r.json();})
    .then(function(d){
      if(d.ok){ toast("✅ 方案已保存到 Obsidian：" + d.file); }
      else { toast("✗ " + (d.error||"保存失败")); }
    })
    .catch(function(e){ toast("✗ 网络错误:" + e); });
}
function saveComb(){
  if(!combSelection.length){ toast("方案为空，先加入几项"); return; }
  var name = prompt("给这个方案起个名（比如：某客户内部Agent方案）", "自由组合方案 " + new Date().toLocaleDateString("zh-CN"));
  if(!name) return;
  fetch("/api/save_plan", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({name:name, picks:combSelection, why:"", concl:"", src:"自由拼装"})})
    .then(function(r){return r.json();})
    .then(function(d){
      if(d.ok){ toast("✅ 方案已保存到 Obsidian：" + d.file); }
      else { toast("✗ " + (d.error||"保存失败")); }
    })
    .catch(function(e){ toast("✗ 网络错误:" + e); });
}

/* ---- 匹配组装引擎: 描述 → 找相关方法卡/案例/坑 ---- */
function matchCardsFor(desc){
  if(!desc) return {cards:[], gaps:[]};
  var q = desc.toLowerCase();
  // 拆词: 英文整词 + 中文 2/3 字滑窗 (与 server 搜索一致)
  var toks = {};
  q.split(/\s+/).forEach(function(w){ if(w.length > 1) toks[w] = 1; });
  var zh = q.replace(/[a-z0-9★·\-_,.，。!！?？:："'’]/g, "").replace(/\s+/g, "");
  for(var i = 0; i < zh.length - 1; i++){ toks[zh.slice(i,i+2)] = 1; }
  for(var i = 0; i < zh.length - 2; i++){ toks[zh.slice(i,i+3)] = 1; }
  var keys = Object.keys(toks);
  if(!keys.length) return {cards:[], gaps:[]};
  // 每张卡: 在 t/what/when/how 里找命中数
  var scored = [];
  CARDS.forEach(function(c){
    var hay = ((c.t||"") + " " + (c.what||"") + " " + (c.when||"") + " " + ((c.how||[]).join(" "))).toLowerCase();
    var hit = 0;
    keys.forEach(function(k){ if(hay.indexOf(k) >= 0) hit++; });
    if(hit > 0) scored.push({c:c, hit:hit});
  });
  scored.sort(function(a,b){ return b.hit - a.hit; });
  var cards = scored.slice(0, 12).map(function(s){ return s.c; });
  return {cards: cards, top: scored.slice(0, 6)};
}
